<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Сенім шегі — Дикторлық мәтін</title>
<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 20px;
  background: #101827;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, Arial, sans-serif;
}
.container {
  max-width: 700px;
  margin: auto;
}
h1 {
  color: #60a5fa;
  text-align: center;
}
.info {
  text-align: center;
  color: #cbd5e1;
  margin-bottom: 25px;
}
.scene {
  background: #1e293b;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 15px;
  line-height: 1.7;
}
.scene h2 {
  color: #93c5fd;
  font-size: 19px;
}
button {
  border: none;
  border-radius: 12px;
  padding: 14px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  width: 100%;
  margin-bottom: 10px;
}
.primary {
  background: #2563eb;
  color: white;
}
.secondary {
  background: #334155;
  color: white;
}
#progress {
  text-align: center;
  color: #93c5fd;
  margin: 15px;
}
@media print {
  body {
    background: white;
    color: black;
  }
  .controls {
    display: none;
  }
  .scene {
    background: white;
    color: black;
    border: 1px solid #ccc;
    break-inside: avoid;
  }
}
</style>
</head>
<body>
<div class="container">
<h1>🎬 СЕНІМ ШЕГІ</h1>
<p class="info">
Қазақша дикторлық мәтін · 12 сахна
</p>
<div class="controls">
  <button class="primary" onclick="startShow()">
    ▶️ Сахналарды көрсету
  </button>
  <button class="secondary" onclick="stopShow()">
    ⏸ Тоқтату
  </button>
  <button class="secondary" onclick="downloadText()">
    📄 Мәтінді TXT ретінде сақтау
  </button>
  <button class="secondary" onclick="window.print()">
    🖨️ PDF ретінде сақтау
  </button>
</div>
<div id="progress">Дайын</div>
<div id="content"></div>
</div>
<script>
const scenes = [
["1-САХНА. КІРІСПЕ",
`Сәлеметсіңдер ме, балалар!
Бүгін біз бейтаныс адамдармен кездескенде өзімізді қалай қауіпсіз ұстау керектігін үйренеміз.
Екі жағдайды талдап, үш маңызды ережені есте сақтаймыз.`],
["2-САХНА. БЕЙТАНЫС АДАМ КІМ?",
`Бейтаныс адам — біз танымайтын адам.
Ол әдемі киінуі, күлімсіреуі немесе өте мейірімді сөйлеуі мүмкін.
Бірақ сыртқы келбетіне қарап, адамға бірден сенуге болмайды.
Ең маңыздысы — өз қауіпсіздігіңді сақтау.`],
["3-САХНА. БІРІНШІ ЖАҒДАЙ: СЫЙЛЫҚ",
`Елестетіп көріңдер: көшеде бейтаныс адам саған келіп:
«Сен жеңімпаз атандың! Мына сыйлықты ал. Тек атың мен телефон нөміріңді жазып кет», — дейді.
Мұндай жағдайда абай болу керек.
Сыйлықты алу үшін жеке мәліметтеріңді берме.
Егер адам қысым көрсетсе немесе соңынан қалмаса, қауіпсіз жерге қарай кет.`],
["4-САХНА. ҚАЛАЙ ӘРЕКЕТ ЕТЕМІЗ?",
`Бірінші — арақашықтық сақта. Бейтаныс адамға жақындама және оның көлігіне отырма.
Екінші — қысқа әрі анық жауап бер: «Жоқ, рақмет. Мен сыйлық ала алмаймын».
Үшінші — ол жерден кетіп, адамдар бар қауіпсіз орынға бар. Мысалы, дүкенге, мектепке немесе күзетші тұрған жерге.
Қажет болса, ата-анаңа, мұғалімге немесе басқа сенімді ересек адамға хабарла.`],
["5-САХНА. ҮШ ЕРЕЖЕ",
`Бірінші ереже: бейтаныс адамның сыйлығына немесе күмәнді ұтысына бірден келіспе.
Екінші ереже: «Жоқ, рақмет» деп айтуға құқығың бар. Қауіпсіздігің үшін сыпайы болуға міндетті емессің.
Үшінші ереже: жеке мәліметтеріңді берме. Үйіңнің мекенжайын, телефон нөміріңді, мектебіңді және күнделікті жүретін жолыңды бейтаныс адамға айтпа.
Есіңде болсын: күмәндансаң, сенімді ересек адамнан көмек сұра.`],
["6-САХНА. БІРІНШІ СҰРАҚ",
`Енді ойланып көрейік.
Бейтаныс адам саған құлаққап ұсынып, атың мен телефон нөміріңді сұрады.
Қай әрекет дұрыс?
А — атың мен нөміріңді беріп, сыйлықты алу.
Б — «Жоқ, рақмет» деп, адамдар бар қауіпсіз жерге кету.
В — сыйлықты алып, бейтаныс адаммен бірге жүру.
Дұрыс жауап — Б. Сыйлық үшін жеке мәліметтеріңді берме және қауіпсіз жерге кет.`],
["7-САХНА. ЕКІНШІ ЖАҒДАЙ: БЕЙТАНЫС КӨЛІК",
`Екінші жағдайды елестетейік.
Сен мектептен үйге қайтып бара жатырсың. Күн суық. Жаныңда бейтаныс көлік тоқтайды.
Жүргізуші: «Отыр, үйіңе дейін тегін жеткізіп саламын», — дейді.
Мұндай көлікке отырма. Жүргізуші мейірімді көрінсе де, оны танымайсың.
Ата-анаңмен алдын ала келіспеген болсаң, бейтаныс адамның көлігіне мінбе.`],
["8-САХНА. КӨЛІК ТОҚТАҒАНДА НЕ ІСТЕУ КЕРЕК?",
`Көлікке жақындамай, қауіпсіз арақашықтықта тұр.
Қысқа жауап бер: «Жоқ, рақмет. Мені ата-анам алып кетеді».
Содан кейін адамдар бар қауіпсіз орынға қарай жүр.
Егер жүргізуші артыңнан жүрсе, жолыңды бөгесе немесе қорқытса, дүкенге, күзет орнына не басқа адамдардың жанына бар.
Қауіп төніп тұрса, қатты дауыстап көмек сұра және сенімді ересек адамға немесе жедел қызметке хабарлас.`],
["9-САХНА. ҮШ ҚАДАМ",
`Бірінші қадам — бас тарт. «Жоқ, рақмет. Мен сені танымаймын», — деп айтуға болады.
Екінші қадам — қауіпсіз жерге кет. Көлікке жақындама және оның соңынан ерме.
Үшінші қадам — көмек сұра. Ата-анаңа, мұғалімге немесе сенімді ересек адамға хабарла.
Егер қауіпсіз болса ғана көліктің түсі мен нөмірін есте сақта. Оны жазамын немесе суретке түсіремін деп өзіңді қауіпке тікпе.`],
["10-САХНА. КӨМЕК СҰРАУ",
`Егер бейтаныс адам сені ұстап алуға тырысса немесе кетуіңе кедергі жасаса, қатты дауыстап айт:
«КӨМЕКТЕСІҢІЗДЕР! МЕН БҰЛ АДАМДЫ ТАНЫМАЙМЫН!»
Адамдар көп жерге қарай жүгіріп, жақын маңдағы сенімді ересек адамнан көмек сұра.
Өзіңді қорғау үшін айқайлаудан қорықпа.
Қауіпсіздік — бәрінен маңызды.`],
["11-САХНА. ЕКІНШІ СҰРАҚ",
`Енді екінші сұрақ.
Бейтаныс көлік тоқтады. Жүргізуші көліктен түсіп, саған жақындап, ұстауға тырысып жатыр.
Қай әрекет дұрыс?
А — үндемей тұру.
Б — онымен сөйлесіп, не қалайтынын сұрау.
В — адамдарға қарай кетіп, қатты дауыстап: «Көмектесіңіздер! Мен бұл адамды танымаймын!» деп айту.
Дұрыс жауап — В. Қауіп төнсе, дереу алыстап, көмек сұра.`],
["12-САХНА. ҚОРЫТЫНДЫ",
`Үш нәрсені есте сақта.
Біріншісі — «Жоқ, рақмет!» деп бас тарт.
Екіншісі — адамдар бар қауіпсіз жерге кет.
Үшіншісі — ата-анаңа немесе сенімді ересек адамға хабарла.
Бейтаныс адаммен болған жағдай өзіңе күмәнді көрінсе, оны жасырып қалма. Сенімді ересек адамға айт.
Сенің қауіпсіздігің — ең маңыздысы.
Назар аударғандарыңа рақмет!`]
];
let current = 0;
let timer = null;
function renderAll() {
  const content = document.getElementById("content");
  content.innerHTML = "";
  scenes.forEach((scene, index) => {
    const card = document.createElement("section");
    card.className = "scene";
    card.id = "scene" + index;
    const heading = document.createElement("h2");
    heading.textContent = scene[0];
    const paragraph = document.createElement("p");
    paragraph.textContent = scene[1];
    paragraph.style.whiteSpace = "pre-line";
    card.appendChild(heading);
    card.appendChild(paragraph);
    content.appendChild(card);
  });
}
function startShow() {
  stopShow();
  current = 0;
  showNext();
}
function showNext() {
  if (current >= scenes.length) {
    document.getElementById("progress").textContent =
      "✅ Барлық сахна аяқталды!";
    return;
  }
  document.getElementById("progress").textContent =
    "Сахна " + (current + 1) + " / " + scenes.length;
  document.getElementById("scene" + current)
    .scrollIntoView({behavior: "smooth", block: "start"});
  current++;
  timer = setTimeout(showNext, 15000);
}
function stopShow() {
  if (timer) clearTimeout(timer);
  timer = null;
  document.getElementById("progress").textContent =
    "⏸ Көрсету тоқтатылды";
}
function downloadText() {
  const text = scenes.map(s => s[0] + "\n\n" + s[1])
    .join("\n\n--------------------\n\n");
  const blob = new Blob(["\uFEFF" + text], {
    type: "text/plain;charset=utf-8"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "senim_shegi.txt";
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
renderAll();
</script>
</body>
</html>
