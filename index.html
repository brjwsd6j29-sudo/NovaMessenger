<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rocket Rise — Demo</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: radial-gradient(circle at 50% 20%, #182653 0%, #090b15 45%, #05060a 100%);
    color: white;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.game {
    width: 100%;
    max-width: 450px;
    min-height: 100vh;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.header {
    text-align: center;
    margin-bottom: 15px;
}

.logo {
    font-size: 28px;
    font-weight: 800;
}

.subtitle {
    color: #777f99;
    font-size: 13px;
    margin-top: 5px;
}

.balance-box {
    background: rgba(20, 24, 42, .8);
    border: 1px solid #29304c;
    border-radius: 18px;
    padding: 15px;
    text-align: center;
    margin-bottom: 15px;
}

.balance-title {
    color: #7d849d;
    font-size: 12px;
    text-transform: uppercase;
}

.balance {
    font-size: 30px;
    font-weight: 800;
    margin-top: 5px;
    color: #ffd700;
}

.arena {
    position: relative;
    height: 350px;
    overflow: hidden;
    border-radius: 24px;
    border: 1px solid #28304e;
    background: linear-gradient(180deg, rgba(21, 34, 75, .65), rgba(7, 10, 21, .9));
}

.star {
    position: absolute;
    width: 2px;
    height: 2px;
    background: white;
    border-radius: 50%;
    opacity: .6;
}

.moon {
    position: absolute;
    right: 35px;
    top: 30px;
    width: 55px;
    height: 55px;
    border-radius: 50%;
    background: #e9efff;
    box-shadow: 0 0 30px rgba(220,230,255,.35);
}

.multiplier {
    position: absolute;
    width: 100%;
    text-align: center;
    top: 35px;
    font-size: 52px;
    font-weight: 900;
    z-index: 5;
}

.multiplier span {
    color: #7d9cff;
}

.multiplier.crashed span {
    color: #ff5c6c;
}

.earth {
    position: absolute;
    bottom: -170px;
    left: 50%;
    transform: translateX(-50%);
    width: 500px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle at 45% 25%, #3566d4, #101c50 55%, #080b1b 75%);
    box-shadow: 0 -10px 50px rgba(70,120,255,.25);
}

.rocket-container {
    position: absolute;
    left: 50%;
    bottom: 65px;
    transform: translateX(-50%);
    z-index: 10;
    transition: bottom .1s linear;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.rocket {
    font-size: 60px;
    transform: rotate(-45deg);
    filter: drop-shadow(0 0 15px rgba(255,120,40,.7));
}

.flame {
    font-size: 35px;
    margin-top: -20px;
    animation: flame .15s infinite alternate;
    display: none;
}

@keyframes flame {
    from { transform: scale(.8); }
    to { transform: scale(1.2); }
}

.status {
    position: absolute;
    bottom: 15px;
    width: 100%;
    text-align: center;
    color: #858ca4;
    font-size: 14px;
    z-index: 20;
}

.controls {
    margin-top: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.bet-panel {
    background: #111522;
    border: 1px solid #252b42;
    border-radius: 16px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.input-group {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.input-group label {
    font-size: 12px;
    color: #777f97;
}

.bet-input {
    background: #181d2e;
    border: 1px solid #2e3654;
    border-radius: 8px;
    color: white;
    padding: 8px 12px;
    font-weight: bold;
    width: 120px;
    text-align: right;
    font-size: 16px;
}

.quick-buttons {
    display: flex;
    gap: 6px;
}

.btn-small {
    flex: 1;
    background: #1c2236;
    border: 1px solid #2c3552;
    color: #a2aabf;
    padding: 6px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.btn-small:hover {
    background: #28314d;
    color: white;
}

button.action-btn {
    width: 100%;
    border: none;
    border-radius: 16px;
    padding: 16px;
    font-size: 18px;
    font-weight: 800;
    cursor: pointer;
    transition: background .2s, opacity .2s;
}

.btn-bet {
    background: linear-gradient(135deg, #28a745, #208637);
    color: white;
}

.btn-collect {
    background: linear-gradient(135deg, #ff9800, #e65100);
    color: white;
    box-shadow: 0 5px 20px rgba(255,152,0,.3);
}

.action-btn:disabled {
    background: #252a3a;
    color: #58607a;
    box-shadow: none;
    cursor: not-allowed;
}

.auto-panel {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #111522;
    border: 1px solid #252b42;
    border-radius: 12px;
    padding: 8px 12px;
    font-size: 13px;
    color: #b7bdd1;
}

.switch {
    position: relative;
    display: inline-block;
    width: 40px;
    height: 20px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
    position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
    background-color: #2b324d; transition: .3s; border-radius: 20px;
}

.slider:before {
    position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
    background-color: white; transition: .3s; border-radius: 50%;
}

input:checked + .slider { background-color: #526eff; }
input:checked + .slider:before { transform: translateX(20px); }

.info {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

.info-box {
    flex: 1;
    background: #111522;
    border: 1px solid #252b42;
    border-radius: 14px;
    padding: 10px;
    text-align: center;
}

.info-title { color: #777f97; font-size: 11px; }
.info-value { margin-top: 4px; font-weight: 800; }
.countdown { color: #7885ff; }
.crashed { color: #ff5c6c; }
.success { color: #5ce39a; }
</style>
</head>

<body>

<div class="game">

    <div class="header">
        <div class="logo">🚀 Rocket Rise</div>
        <div class="subtitle">Демо-игра на виртуальные монеты</div>
    </div>

    <div class="balance-box">
        <div class="balance-title">Баланс монет</div>
        <div class="balance" id="balance">100 000</div>
    </div>

    <div class="arena">
        <div class="moon"></div>
        <div class="star" style="left:10%;top:15%"></div>
        <div class="star" style="left:20%;top:35%"></div>
        <div class="star" style="left:35%;top:20%"></div>
        <div class="star" style="left:55%;top:28%"></div>
        <div class="star" style="left:70%;top:13%"></div>
        <div class="star" style="left:82%;top:42%"></div>

        <div class="multiplier" id="multiplierContainer">
            <span id="multiplier">1.00x</span>
        </div>

        <div class="rocket-container" id="rocketContainer">
            <div class="rocket">🚀</div>
            <div class="flame" id="flame">🔥</div>
        </div>

        <div class="earth"></div>
        <div class="status" id="status">Сделайте ставку для участия</div>
    </div>

    <div class="controls">
        <div class="bet-panel">
            <div class="input-group">
                <label for="betAmount">СУММА СТАВКИ:</label>
                <input type="number" id="betAmount" class="bet-input" value="1000" min="100" step="100">
            </div>
            <div class="quick-buttons">
                <button class="btn-small" onclick="setBet('min')">МИН</button>
                <button class="btn-small" onclick="setBet('half')">1/2</button>
                <button class="btn-small" onclick="setBet('double')">X2</button>
                <button class="btn-small" onclick="setBet('max')">МАКС</button>
            </div>
        </div>

        <div class="auto-panel">
            <span>Автовывод на:</span>
            <input type="number" id="autoTarget" class="bet-input" value="2.00" step="0.1" min="1.1" style="width: 70px; padding: 4px 8px;">
            <label class="switch">
                <input type="checkbox" id="autoToggle">
                <span class="slider"></span>
            </label>
        </div>

        <button class="action-btn btn-bet" id="mainBtn" onclick="handleMainAction()">
            ПОСТАВИТЬ СТАВКУ
        </button>
    </div>

    <div class="info">
        <div class="info-box">
            <div class="info-title">РАУНД</div>
            <div class="info-value" id="round">1</div>
        </div>
        <div class="info-box">
            <div class="info-title">СТАТУС</div>
            <div class="info-value countdown" id="gameStatus">ОЖИДАНИЕ</div>
        </div>
    </div>

</div>

<script>
let balance = 100000;
let currentBet = 0;
let multiplier = 1.00;
let crashPoint = 0;
let round = 1;

// Состояния: "WAITING", "COUNTDOWN", "FLYING", "FINISHED"
let gameState = "WAITING"; 
let isBetPlaced = false;
let hasCashedOut = false;

let startTime = 0;
let animationFrame = null;
let countdownTimer = null;

const balanceEl = document.getElementById("balance");
const multiplierEl = document.getElementById("multiplier");
const multiplierContainer = document.getElementById("multiplierContainer");
const rocketContainer = document.getElementById("rocketContainer");
const flameEl = document.getElementById("flame");
const statusEl = document.getElementById("status");
const gameStatusEl = document.getElementById("gameStatus");
const mainBtn = document.getElementById("mainBtn");
const betInput = document.getElementById("betAmount");
const autoTargetInput = document.getElementById("autoTarget");
const autoToggle = document.getElementById("autoToggle");

function formatNumber(num) {
    return Math.floor(num).toLocaleString("ru-RU");
}

function updateBalanceUI() {
    balanceEl.textContent = formatNumber(balance);
}

function setBet(type) {
    if (gameState === "FLYING") return;
    let val = parseInt(betInput.value) || 0;
    
    if (type === 'min') val = 100;
    else if (type === 'half') val = Math.max(100, Math.floor(val / 2));
    else if (type === 'double') val = Math.min(balance, val * 2);
    else if (type === 'max') val = balance;

    betInput.value = val;
}

// Генерация точки взрыва (Crash Point)
function generateCrashPoint() {
    const rand = Math.random();
    // 5% шанс моментального краша на 1.00x
    if (rand < 0.05) return 1.00; 
    
    // Алгоритм вероятности (чем выше X, тем ниже шанс)
    const e = 101;
    return Math.max(1.01, parseFloat((e / (101 - rand * 100)).toFixed(2)));
}

function handleMainAction() {
    if (gameState === "WAITING" || gameState === "COUNTDOWN") {
        placeBet();
    } else if (gameState === "FLYING" && isBetPlaced && !hasCashedOut) {
        cashOut();
    }
}

function placeBet() {
    const amount = parseInt(betInput.value);

    if (isNaN(amount) || amount < 100) {
        alert("Минимальная ставка: 100 монет");
        return;
    }
    if (amount > balance) {
        alert("Недостаточно монет на балансе!");
        return;
    }

    currentBet = amount;
    balance -= currentBet;
    updateBalanceUI();
    isBetPlaced = true;

    betInput.disabled = true;
    mainBtn.disabled = true;
    mainBtn.textContent = "СТАВКА ПРИНЯТА";
    statusEl.textContent = "Ожидание старта раунда...";

    if (gameState === "WAITING") {
        startCountdown();
    }
}

function startCountdown() {
    gameState = "COUNTDOWN";
    gameStatusEl.textContent = "ОТСЧЁТ";
    gameStatusEl.className = "info-value countdown";

    let time = 5;
    statusEl.innerHTML = `Взлёт через <b>${time}</b> сек.`;

    countdownTimer = setInterval(() => {
        time--;
        if (time > 0) {
            statusEl.innerHTML = `Взлёт через <b>${time}</b> сек.`;
        } else {
            clearInterval(countdownTimer);
            startFlight();
        }
    }, 1000);
}

function startFlight() {
    gameState = "FLYING";
    hasCashedOut = false;
    multiplier = 1.00;
    crashPoint = generateCrashPoint();
    startTime = Date.now();

    multiplierContainer.classList.remove("crashed");
    gameStatusEl.textContent = "ПОЛЁТ";
    gameStatusEl.className = "info-value success";
    flameEl.style.display = "block";

    if (isBetPlaced) {
        mainBtn.disabled = false;
        mainBtn.className = "action-btn btn-collect";
        mainBtn.textContent = "ЗАБРАТЬ";
        statusEl.textContent = "🚀 Ракета летит! Нажмите «Забрать»";
    } else {
        mainBtn.disabled = true;
        mainBtn.className = "action-btn btn-bet";
        mainBtn.textContent = "РАУНД ИДЁТ";
        statusEl.textContent = "Наблюдение за полётом...";
    }

    animationFrame = requestAnimationFrame(updateFlight);
}

function updateFlight() {
    if (gameState !== "FLYING") return;

    const elapsed = (Date.now() - startTime) / 1000;
    
    // Рост множителя от времени
    multiplier = 1 + Math.pow(elapsed, 1.2) * 0.15;

    // Проверка Автовывода
    const autoVal = parseFloat(autoTargetInput.value);
    if (autoToggle.checked && isBetPlaced && !hasCashedOut && multiplier >= autoVal) {
        cashOut();
    }

    // Проверка на взрыв
    if (multiplier >= crashPoint) {
        multiplier = crashPoint;
        multiplierEl.textContent = multiplier.toFixed(2) + "x";
        crash();
        return;
    }

    multiplierEl.textContent = multiplier.toFixed(2) + "x";

    // Анимация подъёма ракеты
    const progressHeight = Math.min(220, elapsed * 25);
    rocketContainer.style.bottom = (65 + progressHeight) + "px";

    animationFrame = requestAnimationFrame(updateFlight);
}

function cashOut() {
    if (hasCashedOut || gameState !== "FLYING") return;

    hasCashedOut = true;
    const winAmount = Math.floor(currentBet * multiplier);
    balance += winAmount;
    updateBalanceUI();

    mainBtn.disabled = true;
    mainBtn.textContent = "УСПЕШНО!";
    statusEl.innerHTML = `✨ Забрано <b>+${formatNumber(winAmount)}</b> монет (${multiplier.toFixed(2)}x)`;
}

function crash() {
    gameState = "FINISHED";
    cancelAnimationFrame(animationFrame);

    flameEl.style.display = "none";
    multiplierContainer.classList.add("crashed");

    gameStatusEl.textContent = "ВЗРЫВ";
    gameStatusEl.className = "info-value crashed";

    if (isBetPlaced && !hasCashedOut) {
        statusEl.innerHTML = `💥 Ракета взорвалась на <b>${multiplier.toFixed(2)}x</b>. Ставка сгорела!`;
    } else if (hasCashedOut) {
        statusEl.innerHTML = `💥 Ракета взорвалась на <b>${multiplier.toFixed(2)}x</b>. Вы успели забрали!`;
    } else {
        statusEl.innerHTML = `💥 Полёт завершён на <b>${multiplier.toFixed(2)}x</b>`;
    }

    mainBtn.disabled = true;
    mainBtn.className = "action-btn btn-bet";
    mainBtn.textContent = "ПОЛЁТ ЗАВЕРШЁН";

    setTimeout(resetRound, 3000);
}

function resetRound() {
    round++;
    document.getElementById("round").textContent = round;

    gameState = "WAITING";
    isBetPlaced = false;
    hasCashedOut = false;

    rocketContainer.style.bottom = "65px";
    multiplierEl.textContent = "1.00x";
    multiplierContainer.classList.remove("crashed");

    betInput.disabled = false;
    mainBtn.disabled = false;
    mainBtn.className = "action-btn btn-bet";
    mainBtn.textContent = "ПОСТАВИТЬ СТАВКУ";
    
    gameStatusEl.textContent = "ОЖИДАНИЕ";
    gameStatusEl.className = "info-value countdown";
    statusEl.textContent = "Сделайте ставку для участия";
}

updateBalanceUI();
</script>

</body>
</html>
