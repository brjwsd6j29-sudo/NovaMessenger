<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIRA Games Log & Control Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --text-color: #e0e6ed;
            --text-muted: #8a99ad;
            --border-color: #232d3f;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding-bottom: 50px;
        }

        .navbar {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.5rem;
        }

        .card-custom {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
        }

        .stat-card {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            background: rgba(79, 172, 254, 0.1);
            color: #00f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 0.875rem;
            margin-bottom: 0;
        }

        .table-custom {
            color: var(--text-color);
            margin-bottom: 0;
        }

        .table-custom th {
            background-color: rgba(255, 255, 255, 0.02);
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            padding: 14px 16px;
        }

        .table-custom td {
            border-bottom: 1px solid var(--border-color);
            padding: 14px 16px;
            vertical-align: middle;
        }

        .table-custom tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .badge-win {
            background-color: rgba(40, 167, 69, 0.15);
            color: #2ecc71;
            border: 1px solid rgba(40, 167, 69, 0.3);
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .badge-lose {
            background-color: rgba(220, 53, 69, 0.15);
            color: #e74c3c;
            border: 1px solid rgba(220, 53, 69, 0.3);
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 600;
        }

        .badge-game {
            background-color: rgba(255, 255, 255, 0.05);
            color: #3498db;
            border: 1px solid rgba(52, 152, 219, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
        }

        .form-control-custom {
            background-color: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
        }

        .form-control-custom:focus {
            background-color: rgba(0, 0, 0, 0.4);
            border-color: #4facfe;
            color: var(--text-color);
            box-shadow: none;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #fff;
            margin-right: 8px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <!-- Навбар -->
    <nav class="navbar navbar-expand-lg mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="fa-solid fa-gamepad me-2"></i>LIRA ULTIMATE V2</a>
            <div class="d-flex align-items-center">
                <span class="badge bg-danger me-3"><i class="fa-solid fa-shield-halved me-1"></i> Admin Panel</span>
                <span class="text-muted small">Status: <span class="text-success">● Online</span></span>
            </div>
        </div>
    </nav>

    <div class="container-fluid px-4">

        <!-- Карточки статистики -->
        <div class="row">
            <div class="col-xl-3 col-md-6">
                <div class="card-custom stat-card">
                    <div>
                        <p class="stat-label">Всего игр в базе</p>
                        <h3 class="stat-value" id="total-games">0</h3>
                    </div>
                    <div class="stat-icon">
                        <i class="fa-solid fa-dice"></i>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card-custom stat-card">
                    <div>
                        <p class="stat-label">Общий оборот ставок</p>
                        <h3 class="stat-value" id="total-bets">0 LIRA</h3>
                    </div>
                    <div class="stat-icon">
                        <i class="fa-solid fa-coins"></i>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card-custom stat-card">
                    <div>
                        <p class="stat-label">Выплачено игрокам</p>
                        <h3 class="stat-value text-success" id="total-wins">0 LIRA</h3>
                    </div>
                    <div class="stat-icon" style="background: rgba(40, 167, 69, 0.1); color: #2ecc71;">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                </div>
            </div>
            <div class="col-xl-3 col-md-6">
                <div class="card-custom stat-card">
                    <div>
                        <p class="stat-label">Профит бота (GGR)</p>
                        <h3 class="stat-value text-info" id="net-profit">0 LIRA</h3>
                    </div>
                    <div class="stat-icon" style="background: rgba(0, 242, 254, 0.1); color: #00f2fe;">
                        <i class="fa-solid fa-chart-line"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Основная таблица логов (games_log) -->
        <div class="card-custom">
            <div class="card-header bg-transparent border-0 pt-4 px-4 d-flex justify-content-between align-items-center">
                <h5 class="fw-bold m-0"><i class="fa-solid fa-list-check me-2 text-info"></i>История Игр (games_log)</h5>
                <div class="d-flex gap-2">
                    <input type="text" id="searchInput" class="form-control form-control-custom" placeholder="Поиск по UID или Игре...">
                    <button class="btn btn-outline-secondary" type="button" id="refreshBtn"><i class="fa-solid fa-rotate"></i></button>
                </div>
            </div>
            <div class="card-body px-0 pb-0">
                <div class="table-responsive">
                    <table class="table table-custom align-middle" id="gamesTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Игрок (UID)</th>
                                <th>Игра</th>
                                <th>Ставка</th>
                                <th>Выигрыш</th>
                                <th>Коэф.</th>
                                <th>Статус</th>
                                <th>Дата и время</th>
                            </tr>
                        </thead>
                        <tbody id="logsTableBody">
                            <!-- Данные генерируются JS из SQLite схемы -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript для эмуляции отображения данных БД бота -->
    <script>
        // Имитация чтения таблицы games_log из файла lira_ultimate_v2.db
        const sampleGamesData = [
            { id: 104, uid: 7895911575, game_name: "Мины", bet: 100000, win_amount: 240000, is_win: 1, date: "04.09.2026 16:20:11", coef: 2.4 },
            { id: 103, uid: 8527487696, game_name: "Хило", bet: 500000, win_amount: 0, is_win: 0, date: "04.09.2026 16:18:45", coef: 1.0 },
            { id: 102, uid: 123456789, game_name: "Мины", bet: 10000, win_amount: 19200, is_win: 1, date: "04.09.2026 16:15:02", coef: 1.92 },
            { id: 101, uid: 7895911575, game_name: "Хило", bet: 2000000, win_amount: 5800000, is_win: 1, date: "04.09.2026 16:02:30", coef: 2.9 },
            { id: 100, uid: 987654321, game_name: "Мины", bet: 50000, win_amount: 0, is_win: 0, date: "04.09.2026 15:58:12", coef: 0.0 }
        ];

        function renderStats(data) {
            let totalGames = data.length;
            let totalBets = data.reduce((sum, item) => sum + item.bet, 0);
            let totalWins = data.reduce((sum, item) => sum + item.win_amount, 0);
            let profit = totalBets - totalWins;

            document.getElementById('total-games').innerText = totalGames;
            document.getElementById('total-bets').innerText = totalBets.toLocaleString() + " LIRA";
            document.getElementById('total-wins').innerText = totalWins.toLocaleString() + " LIRA";
            document.getElementById('net-profit').innerText = (profit >= 0 ? "+" : "") + profit.toLocaleString() + " LIRA";
        }

        function renderTable(data) {
            const tbody = document.getElementById('logsTableBody');
            tbody.innerHTML = '';

            data.forEach(row => {
                const tr = document.createElement('tr');
                
                const winBadge = row.is_win === 1 
                    ? `<span class="badge-win"><i class="fa-solid fa-check me-1"></i>Победа</span>`
                    : `<span class="badge-lose"><i class="fa-solid fa-xmark me-1"></i>Проиграл</span>`;

                tr.innerHTML = `
                    <td class="text-muted">#${row.id}</td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="user-avatar">${row.uid.toString().substring(0,2)}</div>
                            <span class="fw-bold">${row.uid}</span>
                        </div>
                    </td>
                    <td><span class="badge-game">${row.game_name}</span></td>
                    <td class="fw-bold">${row.bet.toLocaleString()}</td>
                    <td class="${row.win_amount > 0 ? 'text-success fw-bold' : 'text-muted'}">${row.win_amount.toLocaleString()}</td>
                    <td><span class="text-info">x${row.coef.toFixed(2)}</span></td>
                    <td>${winBadge}</td>
                    <td class="text-muted small">${row.date}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Поиск по таблице
        document.getElementById('searchInput').addEventListener('keyup', function() {
            let filter = this.value.toLowerCase();
            let filteredData = sampleGamesData.filter(item => 
                item.uid.toString().includes(filter) || 
                item.game_name.toLowerCase().includes(filter)
            );
            renderTable(filteredData);
        });

        // Инициализация
        renderStats(sampleGamesData);
        renderTable(sampleGamesData);
    </script>
</body>
</html>
