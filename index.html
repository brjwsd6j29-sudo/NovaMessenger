<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>36 клеток</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #222;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(6, 60px);
      gap: 8px;
    }

    .cell {
      width: 60px;
      height: 60px;
      background: gray;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    .cell.white {
      background: white;
    }
  </style>
</head>

<body>

  <div class="grid" id="grid"></div>

  <script>
    const grid = document.getElementById("grid");

    // Создаём 36 клеток
    for (let i = 0; i < 36; i++) {
      const cell = document.createElement("div");
      cell.classList.add("cell");

      // Нажатие: серый <-> белый
      cell.addEventListener("click", () => {
        cell.classList.toggle("white");
      });

      grid.appendChild(cell);
    }
  </script>

</body>
</html>
