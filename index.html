<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тестовая страница HTML</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #4a5568;
            margin-bottom: 10px;
        }
        p {
            color: #718096;
            margin-bottom: 20px;
        }
        button {
            background-color: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover {
            background-color: #5a67d8;
        }
        button:active {
            transform: scale(0.95);
        }
        #counter {
            font-weight: bold;
            color: #764ba2;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Привет! 👋</h1>
        <p>Это тестовая HTML-страница со встроенными стилями и скриптом.</p>
        <button id="clickBtn">Нажми на меня</button>
        <p style="margin-top: 20px;">Количество кликов: <span id="counter">0</span></p>
    </div>

    <script>
        const btn = document.getElementById('clickBtn');
        const counterSpan = document.getElementById('counter');
        let count = 0;

        btn.addEventListener('click', () => {
            count++;
            counterSpan.textContent = count;
        });
    </script>

</body>
</html>
