<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Center WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #1a1a1a);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #2a2a2a);
            --button-bg: var(--tg-theme-button-color, #3b82f6);
            --button-text: var(--tg-theme-button-text-color, #ffffff);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .balance-badge {
            background: #eab308;
            color: #000;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .games-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: var(--button-bg);
            color: var(--button-text);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button:active {
            opacity: 0.8;
        }

        .game-box {
            display: none;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        input {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #111;
            color: #fff;
        }
    </style>
</head>
<body>

    <!-- СЕКЦИЯ ПРОФИЛЯ -->
    <div class="card">
        <div class="profile-header">
            <div>
                <h3 id="user-name" style="margin:0;">Игрок</h3>
                <small id="user-id" style="opacity: 0.6;">ID: 0000000</small>
            </div>
            <div class="balance-badge">
                💰 <span id="balance">100</span> DC
            </div>
        </div>
    </div>

    <!-- МЕНЮ ИГР -->
    <div class="card">
        <h3>Игровой зал</h3>
        <div class="games-grid">
            
            <!-- Игра 1: Монетка -->
            <button onclick="toggleGame('coin-game')">🪙 Орел или Решка</button>
            <div id="coin-game" class="game-box">
                <p>Ставка: 10 DC (Выигрыш: 20 DC)</p>
                <div style="display:flex; gap:10px;">
                    <button onclick="playCoin('heads')">Орёл</button>
                    <button onclick="playCoin('tails')">Решка</button>
                </div>
            </div>

            <!-- Игра 2: Угадай число -->
            <button onclick="toggleGame('number-game')">🔢 Угадай число (1-5)</button>
            <div id="number-game" class="game-box">
                <p>Ставка: 20 DC (Выигрыш: 100 DC)</p>
                <input type="number" id="guess-input" min="1" max="5" placeholder="Введи число от 1 до 5">
                <button onclick="playGuessNumber()">Сделать ставку</button>
            </div>

        </div>
    </div>

    <!-- КНОПКА СОХРАНЕНИЯ -->
    <button onclick="exitAndSave()" style="background-color: #22c55e;">Сохранить и выйти</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let balance = 100;

        // Загрузка данных профиля из Telegram
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = user.first_name;
            document.getElementById('user-id').innerText = `ID: ${user.id}`;
        }

        function updateBalance(amount) {
            balance += amount;
            document.getElementById('balance').innerText = balance;
        }

        function toggleGame(id) {
            const box = document.getElementById(id);
            box.style.display = box.style.display === 'block' ? 'none' : 'block';
        }

        // Логика Игры 1: Орел и Решка
        function playCoin(choice) {
            if (balance < 10) return alert("Недостаточно средств!");
            updateBalance(-10);

            const result = Math.random() < 0.5 ? 'heads' : 'tails';
            const win = choice === result;

            if (win) {
                updateBalance(20);
                alert(`Выпало: ${result === 'heads' ? 'Орёл' : 'Решка'}! Вы выиграли 20 DC! 🎉`);
            } else {
                alert(`Выпало: ${result === 'heads' ? 'Орёл' : 'Решка'}! Вы проиграли. 😢`);
            }
        }

        // Логика Игры 2: Угадай число
        function playGuessNumber() {
            const input = document.getElementById('guess-input');
            const userGuess = parseInt(input.value);

            if (!userGuess || userGuess < 1 || userGuess > 5) return alert("Введите число от 1 до 5!");
            if (balance < 20) return alert("Недостаточно средств!");

            updateBalance(-20);
            const secret = Math.floor(Math.random() * 5) + 1;

            if (userGuess === secret) {
                updateBalance(100);
                alert(`Правильно! Число было ${secret}. Вы выиграли 100 DC! 🚀`);
            } else {
                alert(`Не угадали! Было загадано число ${secret}.`);
            }
            input.value = '';
        }

        // Отправка итоговых данных обратно боту
        function exitAndSave() {
            tg.sendData(JSON.stringify({
                action: "update_balance",
                final_balance: balance
            }));
        }
    </script>
</body>
</html>
