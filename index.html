<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Game Center</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

:root {
    --bg: var(--tg-theme-bg-color, #101114);
    --text: var(--tg-theme-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #191b21);
    --button: var(--tg-theme-button-color, #3b82f6);
}

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    padding: 15px;

    min-height: 100vh;

    background: var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.card {

    background: var(--card);

    border-radius: 16px;

    padding: 16px;

    margin-bottom: 14px;
}

.profile {

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 10px;
}

.avatar {

    width: 48px;

    height: 48px;

    border-radius: 50%;

    background: #3b82f6;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 22px;

    font-weight: bold;
}

.profile-left {

    display: flex;

    align-items: center;

    gap: 10px;
}

.name {

    font-size: 17px;

    font-weight: bold;
}

.id {

    opacity: .55;

    font-size: 12px;

    margin-top: 3px;
}

.balance {

    background: #eab308;

    color: #000;

    padding: 8px 12px;

    border-radius: 20px;

    font-weight: bold;

    white-space: nowrap;
}

button {

    width: 100%;

    border: 0;

    border-radius: 12px;

    padding: 13px;

    background: var(--button);

    color: white;

    font-size: 16px;

    font-weight: bold;

    margin-top: 8px;
}

button:disabled {

    opacity: .5;
}

.game {

    display: none;

    padding-top: 10px;
}

input {

    width: 100%;

    padding: 12px;

    border-radius: 10px;

    border: 1px solid #444;

    background: #101114;

    color: white;

    font-size: 16px;
}

.result {

    text-align: center;

    font-size: 18px;

    margin-top: 12px;
}

.history-item {

    display: flex;

    justify-content: space-between;

    padding: 10px 0;

    border-bottom: 1px solid
        rgba(255,255,255,.08);
}

.loading {

    text-align: center;

    padding: 30px;

    opacity: .7;
}

</style>

</head>

<body>

<div id="loading" class="loading">
    ⏳ Загрузка профиля...
</div>

<div id="app" style="display:none;">

    <!-- ПРОФИЛЬ -->

    <div class="card">

        <div class="profile">

            <div class="profile-left">

                <div
                    class="avatar"
                    id="avatar"
                >
                    ?
                </div>

                <div>

                    <div
                        class="name"
                        id="user-name"
                    >
                        Игрок
                    </div>

                    <div
                        class="id"
                        id="user-id"
                    >
                        ID
                    </div>

                </div>

            </div>

            <div class="balance">

                💰
                <span id="balance">
                    0
                </span>
                DC

            </div>

        </div>

    </div>

    <!-- ИГРЫ -->

    <div class="card">

        <h3>
            🎮 Игровой зал
        </h3>

        <button
            onclick="toggleGame('coin-game')"
        >
            🪙 Орёл или Решка
        </button>

        <div
            id="coin-game"
            class="game"
        >

            <p>
                Выбери сторону:
            </p>

            <button
                onclick="playCoin('heads')"
            >
                🪙 Орёл
            </button>

            <button
                onclick="playCoin('tails')"
            >
                🪙 Решка
            </button>

            <div
                id="coin-result"
                class="result"
            ></div>

        </div>


        <button
            onclick="toggleGame('number-game')"
        >
            🔢 Угадай число
        </button>

        <div
            id="number-game"
            class="game"
        >

            <p>
                Сервер загадал число от 1 до 5.
            </p>

            <input
                id="guess"
                type="number"
                min="1"
                max="5"
                placeholder="1 - 5"
            >

            <button
                onclick="playNumber()"
            >
                🎯 Проверить
            </button>

            <div
                id="number-result"
                class="result"
            ></div>

        </div>

    </div>

    <!-- ИСТОРИЯ -->

    <div class="card">

        <h3>
            📜 Последние игры
        </h3>

        <div id="history">
            Пока нет игр
        </div>

    </div>

</div>


<script>

const tg =
    window.Telegram.WebApp;

tg.ready();

tg.expand();


/*
 * Telegram user
 */

const telegramUser =
    tg.initDataUnsafe?.user;


if (!telegramUser) {

    document.getElementById("loading")
        .innerHTML =
        "❌ Открой сайт через Telegram.";

    throw new Error(
        "Telegram user not found"
    );
}


const telegramId =
    telegramUser.id;


/*
 * Здесь НЕ храним баланс.
 *
 * Он приходит только с сервера.
 */

let currentBalance = 0;


/*
 * Форматирование чисел
 */

function formatNumber(number) {

    return Number(number)
        .toLocaleString("ru-RU");
}


/*
 * Загрузка профиля
 */

async function loadProfile() {

    try {

        const response =
            await fetch(
                "/.netlify/functions/player",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        telegram_id:
                            telegramId,

                        username:
                            telegramUser.username || null,

                        first_name:
                            telegramUser.first_name || "Игрок"
                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error || "Ошибка"
            );
        }


        const user =
            data.user;


        currentBalance =
            Number(user.balance);


        document.getElementById(
            "user-name"
        ).textContent =
            user.first_name;


        document.getElementById(
            "user-id"
        ).textContent =
            "ID: " + user.telegram_id;


        document.getElementById(
            "avatar"
        ).textContent =
            user.first_name
                .charAt(0)
                .toUpperCase();


        updateBalance();


        document.getElementById(
            "loading"
        ).style.display = "none";


        document.getElementById(
            "app"
        ).style.display = "block";


    } catch (error) {

        console.error(error);

        document.getElementById(
            "loading"
        ).innerHTML =
            "❌ Не удалось загрузить профиль.";
    }
}


/*
 * Баланс
 */

function updateBalance() {

    document.getElementById(
        "balance"
    ).textContent =
        formatNumber(currentBalance);
}


/*
 * Открытие игры
 */

function toggleGame(id) {

    const game =
        document.getElementById(id);

    game.style.display =
        game.style.display === "block"
            ? "none"
            : "block";
}


/*
 * Орёл / решка
 */

async function playCoin(choice) {

    const resultElement =
        document.getElementById(
            "coin-result"
        );

    resultElement.textContent =
        "⏳ Играем...";


    try {

        const response =
            await fetch(
                "/.netlify/functions/game",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        telegram_id:
                            telegramId,

                        game_type:
                            "coin"
                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error || "Ошибка"
            );
        }


        currentBalance =
            Number(data.balance);

        updateBalance();


        const result =
            data.result === "heads"
                ? "Орёл"
                : "Решка";


        resultElement.innerHTML =
            `Выпало: <b>${result}</b><br>
             🎉 +${formatNumber(data.points)} DC`;


        addHistory(
            "🪙 Орёл/Решка",
            `+${formatNumber(data.points)} DC`
        );


    } catch (error) {

        console.error(error);

        resultElement.textContent =
            "❌ Ошибка игры";
    }
}


/*
 * Угадай число
 */

async function playNumber() {

    const input =
        document.getElementById("guess");

    const guess =
        Number(input.value);


    if (
        !guess ||
        guess < 1 ||
        guess > 5
    ) {

        alert(
            "Введите число от 1 до 5"
        );

        return;
    }


    const resultElement =
        document.getElementById(
            "number-result"
        );

    resultElement.textContent =
        "⏳ Проверяем...";


    try {

        const response =
            await fetch(
                "/.netlify/functions/game",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        telegram_id:
                            telegramId,

                        game_type:
                            "number"
                    })
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error || "Ошибка"
            );
        }


        currentBalance =
            Number(data.balance);

        updateBalance();


        resultElement.innerHTML =
            `Сервер загадал: <b>${data.result}</b><br>
             🎉 +${formatNumber(data.points)} DC`;


        addHistory(
            "🔢 Угадай число",
            `+${formatNumber(data.points)} DC`
        );


        input.value = "";


    } catch (error) {

        console.error(error);

        resultElement.textContent =
            "❌ Ошибка игры";
    }
}


/*
 * История в текущем открытии WebApp
 */

function addHistory(
    game,
    points
) {

    const history =
        document.getElementById(
            "history"
        );


    if (
        history.textContent ===
        "Пока нет игр"
    ) {

        history.innerHTML = "";
    }


    const item =
        document.createElement("div");


    item.className =
        "history-item";


    item.innerHTML = `
        <span>${game}</span>
        <b>${points}</b>
    `;


    history.prepend(item);
}


/*
 * Запускаем
 */

loadProfile();

</script>

</body>
</html>
