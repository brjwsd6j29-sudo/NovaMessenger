<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Қолөнер мен кәсіптер — Жауаптар</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    background:
        radial-gradient(circle at top left, #243b7a 0%, transparent 35%),
        radial-gradient(circle at bottom right, #3b176e 0%, transparent 35%),
        #080b16;
    color: white;
    min-height: 100vh;
    padding: 20px;
}

.container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

/* HEADER */

.header {
    text-align: center;
    padding: 35px 20px;
    margin-bottom: 25px;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 28px;
    background: rgba(255,255,255,.06);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,.35);
}

.icon {
    width: 75px;
    height: 75px;
    margin: 0 auto 18px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 38px;
    background: linear-gradient(135deg,#667eea,#764ba2);
    box-shadow: 0 10px 30px rgba(118,75,162,.4);
}

h1 {
    font-size: 30px;
    margin-bottom: 10px;
}

.subtitle {
    color: #aeb6d1;
    font-size: 15px;
}

/* PROGRESS */

.progress-box {
    margin-top: 25px;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    color: #aeb6d1;
    font-size: 13px;
    margin-bottom: 8px;
}

.progress {
    height: 8px;
    background: rgba(255,255,255,.1);
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg,#667eea,#a855f7);
    border-radius: 20px;
    transition: .4s;
}

/* QUESTIONS */

.questions {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

.question {
    background: rgba(255,255,255,.055);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 23px;
    padding: 22px;
    backdrop-filter: blur(15px);
    box-shadow: 0 12px 35px rgba(0,0,0,.22);
    transition: .3s;
}

.question:hover {
    transform: translateY(-2px);
    border-color: rgba(125,140,255,.35);
}

.question-top {
    display: flex;
    align-items: flex-start;
    gap: 14px;
}

.number {
    min-width: 40px;
    height: 40px;
    border-radius: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#667eea,#764ba2);
    font-weight: 800;
    font-size: 15px;
}

.question-text {
    font-size: 16px;
    line-height: 1.5;
    font-weight: 600;
}

/* OPTIONS */

.options {
    margin-top: 18px;
    display: grid;
    gap: 9px;
}

.option {
    padding: 12px 15px;
    border-radius: 13px;
    background: rgba(255,255,255,.045);
    color: #cbd1e5;
    border: 1px solid rgba(255,255,255,.07);
    font-size: 14px;
    transition: .25s;
}

.option.correct {
    background: rgba(34,197,94,.15);
    border-color: #22c55e;
    color: #86efac;
    font-weight: 700;
}

/* BUTTON */

.answer-btn {
    margin-top: 17px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: white;
    font-size: 14px;
    font-weight: 700;
    background: linear-gradient(135deg,#667eea,#764ba2);
    box-shadow: 0 7px 20px rgba(102,126,234,.22);
    transition: .25s;
}

.answer-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.1);
}

.answer-btn:active {
    transform: scale(.98);
}

/* ANSWER */

.answer {
    display: none;
    margin-top: 14px;
    padding: 14px 16px;
    border-radius: 14px;
    background: rgba(34,197,94,.10);
    border: 1px solid rgba(34,197,94,.35);
    color: #86efac;
    line-height: 1.5;
    animation: show .3s ease;
}

.answer.show {
    display: block;
}

@keyframes show {
    from {
        opacity: 0;
        transform: translateY(-6px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* FOOTER */

.footer {
    text-align: center;
    color: #777f99;
    font-size: 13px;
    padding: 30px 0 10px;
}

/* MOBILE */

@media(max-width:600px) {
    body {
        padding: 12px;
    }

    .header {
        padding: 28px 15px;
        border-radius: 22px;
    }

    h1 {
        font-size: 24px;
    }

    .question {
        padding: 17px;
        border-radius: 19px;
    }

    .question-text {
        font-size: 15px;
    }

    .option {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">

        <div class="icon">📚</div>

        <h1>Қолөнер мен кәсіптер</h1>

        <div class="subtitle">
            §3–4 бойынша тест жауаптары
        </div>

        <div class="progress-box">

            <div class="progress-info">
                <span>Жауаптар</span>
                <span id="counter">0 / 21</span>
            </div>

            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>

        </div>

    </div>


    <div class="questions" id="questions"></div>


    <div class="footer">
        Қазақстан тарихы • 11 сынып
    </div>

</div>


<script>

const questions = [

{
    q: "Қазақстан жеріндегі тұрғындар негізгі бөлігінің 4000 жыл бойы автохтонды түрде өлкені тұрақты мекендеп келгенін дәлелдеген антрополог, академик",
    options: [
        "A) К. Ақышев",
        "B) Ш. Шөкин",
        "C) О. Смағұлов",
        "D) Қ. Сәтбаев"
    ],
    answer: 2
},

{
    q: "Киіз жасауды білген қазақ халқының арғы ата-бабасы:",
    options: [
        "A) аландар",
        "B) ахеменидтер",
        "C) пенджабтықтар",
        "D) сақтар"
    ],
    answer: 3
},

{
    q: "1969 ж. Есік қорғанын ашқан белгілі археолог",
    options: [
        "A) О. Смағұлов",
        "B) Қ. Сәтбаев",
        "C) К. Ақышев",
        "D) Ә. Марғұлан"
    ],
    answer: 2
},

{
    q: "«Қазақтардың амандасуы «мал-жан аман ба?» деуден басталады» деп көшпелілер тұрмысындағы малдың маңызын дәл сипаттаған",
    options: [
        "A) Ә. Марғұлан",
        "B) Ы. Алтынсарин",
        "C) Ш. Уәлиханов",
        "D) А. Құнанбаев"
    ],
    answer: 2
},

{
    q: "«Темір ұсталары балта, үзеңгі, ер-тұрман, пышақ жасады... Бұл заттардың сапасы біздегі Ресей бұйымдарынан кем түспейді» деп қазақ ұсталарының жасаған бұйымдарына жоғары баға берген зерттеуші",
    options: [
        "A) В. В. Радлов",
        "B) Д. Сокольский",
        "C) И. Я. Скворцов",
        "D) Л. Н. Гумилев"
    ],
    answer: 0
},

{
    q: "Қазақтарда күнделікті өмірде кеңінен қолданылатын үй малы терісінен жасалған ыдыстар",
    options: [
        "A) тегене, шара",
        "B) ожау, астау",
        "C) тон, ішік, мәсі",
        "D) саба, торсық, мес"
    ],
    answer: 3
},

{
    q: "Теріден жасалған бие саууға арналған ыдыс",
    options: [
        "A) балға",
        "B) найза",
        "C) ожау",
        "D) көнек"
    ],
    answer: 3
},

{
    q: "Қазіргі қазақ оюларымен ұқсас келетін ою-өрнектер бар бұйымдар табылған қорған",
    options: [
        "A) Ботай",
        "B) Есік",
        "C) Шілікті",
        "D) Пазырық"
    ],
    answer: 3
},

{
    q: "Қазақтар кең тараған ағаштан шабылған ыдыс түрлері",
    options: [
        "A) саба, торсық, мес, көнек",
        "B) балға, балта, найза",
        "C) айыр, тырма, күрек",
        "D) тегене, шара, ожау, астау"
    ],
    answer: 3
},

{
    q: "Қазақтарда жабайы аң терісінен пішілген сыртқы киім",
    options: [
        "A) тырма",
        "B) күрек",
        "C) тон (ішік)",
        "D) көнек"
    ],
    answer: 2
},

{
    q: "Байлық пен молшылықты, дәулет пен еркіндікті білдіретін, киізден жасалған бұйымдарда қолданылатын ою-өрнек",
    options: [
        "A) толқын",
        "B) жұлдыз",
        "C) қошқармүйіз",
        "D) құланкірпі"
    ],
    answer: 2
},

{
    q: "Қазақ оюларына ұқсас ою-өрнектермен безендірілген Есік қорғанынан табылған жәдігер",
    options: [
        "A) «Күміс адам»",
        "B) «Алтын адам»",
        "C) «Шілікті әйелі»",
        "D) «Сармат әйелі»"
    ],
    answer: 1
},

{
    q: "«Қазақтың ою-өрнегі - сақ, үйсін, ғұн, түркі, қаңлы, қыпшақ секілді көне көшпелі тайпалар өнерінің негізінде қалыптасты» деп жазған",
    options: [
        "A) Ы. Алтынсарин",
        "B) Ш. Уәлиханов",
        "C) А. Құнанбаев",
        "D) Ә. Марғұлан"
    ],
    answer: 3
},

{
    q: "Көшпелі өмірге бейімделген, ерте заманнан келе жатқан көшпелілердің баспанасы",
    options: [
        "A) там",
        "B) киіз үй",
        "C) сарай",
        "D) қақыра"
    ],
    answer: 1
},

{
    q: "Жезқазған маңындағы кен орындарын тауып, бұл аумақтың көне металлургия орталықтарының бірі болғанын дәлелдеген",
    options: [
        "A) К. Ақышев",
        "B) Ш. Шөкин",
        "C) Қ. Сәтбаев",
        "D) Ә. Марғұлан"
    ],
    answer: 2
},

{
    q: "Кілемнің алғашқы үлгітүрлері табылған Алтай маңындағы қола дәуіріне жататын қорғандар",
    options: [
        "A) Шілікті, Берел",
        "B) Бесшатыр, Берел",
        "C) Тасмола, Есік",
        "D) Пазырық, Нойын-Улинск"
    ],
    answer: 3
},

{
    q: "Өзіне ұнаған затты, бұйымды үй иесінен сұрап алу салты",
    options: [
        "A) сырға салу",
        "B) сүйінші",
        "C) жоқтау",
        "D) қалау"
    ],
    answer: 3
},

{
    q: "Қабір үстіне құлпытастар тұрғызудың кең таралған аймағы",
    options: [
        "A) Батыс Қазақстан",
        "B) Шығыс Қазақстан",
        "C) Солтүстік Қазақстан",
        "D) Оңтүстік Қазақстан"
    ],
    answer: 0
},

{
    q: "Қазақтың ұлттық ою-өрнек түрлерін сәйкестендіріңіз: 1. Зооморфтық 2. Өсімдік тектес 3. Космогониялық 4. Геометриялық",
    options: [
        "A) 1-В, 2-А, 3-С, 4-D",
        "B) 1-А, 2-С, 3-D, 4-В",
        "C) 1-В, 2-С, 3-А, 4-D",
        "D) 1-С, 2-D, 3-В, 4-А",
        "E) 1-С, 2-В, 3-D, 4-А"
    ],
    answer: 2
},

{
    q: "Тоқылу ерекшелігіне қарай қазақ кілемдерінің түрлері",
    options: [
        "A) түкті және тақыр",
        "B) көлденеңінен және тігінен",
        "C) жанама және тікелей",
        "D) киізді және жібекті"
    ],
    answer: 0
},

{
    q: "Қайың, қараағаш, үйеңкі ағашынан дайындалатын құрал-саймандар",
    options: [
        "A) сырмақ, текемет, аяққап",
        "B) түскиіз, алаша",
        "C) айыр, тырма, күрек"
    ],
    answer: 2
}

];

let shown = 0;

const container = document.getElementById("questions");

questions.forEach((item, index) => {

    const card = document.createElement("div");
    card.className = "question";

    const optionsHTML = item.options.map((option, i) => {

        return `
            <div class="option" data-index="${i}">
                ${option}
            </div>
        `;

    }).join("");

    card.innerHTML = `

        <div class="question-top">

            <div class="number">
                ${index + 1}
            </div>

            <div class="question-text">
                ${item.q}
            </div>

        </div>

        <div class="options">
            ${optionsHTML}
        </div>

        <button class="answer-btn">
            👁 Жауабын көрсету
        </button>

        <div class="answer">
            ✅ Дұрыс жауап:
            <strong>${item.options[item.answer]}</strong>
        </div>

    `;

    container.appendChild(card);

});


document.querySelectorAll(".answer-btn").forEach((button, index) => {

    button.addEventListener("click", () => {

        const card = button.closest(".question");
        const answer = card.querySelector(".answer");
        const correctOption = card.querySelector(
            `.option[data-index="${questions[index].answer}"]`
        );

        if (!answer.classList.contains("show")) {

            answer.classList.add("show");

            correctOption.classList.add("correct");

            button.innerHTML = "✓ Жауап көрсетілді";

            shown++;

            document.getElementById("counter").textContent =
                `${shown} / ${questions.length}`;

            document.getElementById("progressBar").style.width =
                `${(shown / questions.length) * 100}%`;

        } else {

            answer.classList.remove("show");

            correctOption.classList.remove("correct");

            button.innerHTML = "👁 Жауабын көрсету";

            shown--;

            document.getElementById("counter").textContent =
                `${shown} / ${questions.length}`;

            document.getElementById("progressBar").style.width =
                `${(shown / questions.length) * 100}%`;
        }

    });

});

</script>

</body>
</html>
