
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orb Zone</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;background:#090a0e;color:#fff;
  font-family:Arial,sans-serif;display:flex;
  justify-content:center;padding:20px 12px;
}
.app{width:100%;max-width:650px}
h1{text-align:center;margin:8px 0;font-size:30px}
.sub{text-align:center;color:#999;margin-bottom:24px}
.panel{
  background:#191a20;border:1px solid #292a32;
  border-radius:20px;padding:17px;margin-bottom:16px
}
.label{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}
input[type=range]{width:100%;accent-color:#15dc83}
input[type=number]{
  width:95px;padding:10px;background:#101116;
  border:1px solid #373841;border-radius:9px;color:white
}
.field{
  position:relative;width:100%;aspect-ratio:1.45;
  overflow:hidden;border-radius:24px;background:#292c32
}
canvas{width:100%;height:100%;display:block}
.orb{
  position:absolute;width:48px;height:48px;border-radius:50%;
  left:50%;top:50%;transform:translate(-50%,-50%);
  display:grid;place-items:center;font-size:29px;color:#68717c;
  background:radial-gradient(circle at 30% 25%,#fff,#d8dce5 60%,#858d9a);
  border:2px solid #f6f8ff;
  box-shadow:0 0 14px #fff9,0 0 30px #dbe4ff66;
  z-index:3;pointer-events:none
}
.symbol{
  position:absolute;transform:translate(-50%,-50%);
  font-size:clamp(30px,8vw,48px);z-index:2;
  pointer-events:none;text-shadow:0 3px 8px #0008
}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
button{
  padding:14px 10px;border:0;border-radius:12px;
  background:#f3f3f6;color:#111;font-size:15px;
  font-weight:bold;cursor:pointer
}
button.secondary{background:#30313a;color:white}
button:disabled{opacity:.45}
.status{text-align:center;min-height:24px;margin-top:15px;color:#bbb}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:#101116;border-radius:12px;padding:12px 5px;text-align:center}
.stat strong{display:block;font-size:22px;margin-bottom:5px}
.stat span{font-size:12px;color:#999}
.green{color:#18e58b}.red{color:#ff7777}
.small{font-size:12px;color:#8e909a;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <h1>ORB ZONE</h1>
  <div class="sub">Random zone simulator</div>

  <div class="panel">
    <div class="label">
      <label for="chance">Шанс победы</label>
      <strong id="chanceText">50%</strong>
    </div>
    <input id="chance" type="range" min="0" max="100" value="50">
    <div class="label" style="margin-top:14px">
      <label for="batch">Шаров в серии</label>
      <input id="batch" type="number" min="1" max="100" value="10">
    </div>
    <p class="small">
      Шанс задаёт вероятность результата в симуляции.
      При 50% ожидается примерно половина побед на большой серии,
      но конкретная серия может отличаться.
    </p>
  </div>

  <div class="field" id="field">
    <canvas id="canvas"></canvas>
    <div class="symbol" id="winIcon">✦</div>
    <div class="symbol" id="loseIcon">💀</div>
    <div class="orb" id="orb">⊕</div>
  </div>

  <div class="buttons">
    <button id="play">Запустить шар</button>
    <button id="newZones" class="secondary">Новые зоны ↻</button>
    <button id="batchPlay" class="secondary">Запустить серию</button>
    <button id="reset" class="secondary">Сбросить статистику</button>
  </div>

  <div class="status" id="status">Готово к запуску</div>

  <div class="panel" style="margin-top:16px">
    <div class="stats">
      <div class="stat"><strong id="total">0</strong><span>Запусков</span></div>
      <div class="stat"><strong id="wins" class="green">0</strong><span>Побед</span></div>
      <div class="stat"><strong id="losses" class="red">0</strong><span>Убытков</span></div>
    </div>
    <p class="small" id="actual">Фактическая доля побед: 0%</p>
  </div>
</div>

<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const field=document.getElementById('field');
const orb=document.getElementById('orb');
const winIcon=document.getElementById('winIcon');
const loseIcon=document.getElementById('loseIcon');
const chanceInput=document.getElementById('chance');
const chanceText=document.getElementById('chanceText');
const statusEl=document.getElementById('status');

let W=0,H=0;
let zones=[];
let busy=false;
let wins=0,losses=0,total=0;
let runId=0;

const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

function resize(){
  const r=field.getBoundingClientRect();
  W=r.width;H=r.height;
  const dpr=window.devicePixelRatio||1;
  canvas.width=Math.round(W*dpr);
  canvas.height=Math.round(H*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawZones();
}
window.addEventListener('resize',resize);

function randomZones(){
  // Pick a random geometry: vertical, horizontal, diagonal,
  // or a triangular corner layout.
  const type=Math.floor(Math.random()*8);
  const offset=rand(-.10,.10);

  if(type===0){
    zones=[{kind:'half',nx:1,ny:0,c:offset}];
  }else if(type===1){
    zones=[{kind:'half',nx:0,ny:1,c:offset}];
  }else if(type===2){
    zones=[{kind:'half',nx:1,ny:1,c:offset}];
  }else if(type===3){
    zones=[{kind:'half',nx:1,ny:-1,c:offset}];
  }else if(type===4){
    zones=[{kind:'corner',corner:0}];
  }else if(type===5){
    zones=[{kind:'corner',corner:1}];
  }else if(type===6){
    zones=[{kind:'corner',corner:2}];
  }else{
    zones=[{kind:'corner',corner:3}];
  }

  // Independently randomize which side is the winning side.
  zones[0].greenPositive=Math.random()<.5;
  drawZones();
  placeIcons();
  resetOrb();
}

function signed(nx,ny,c,x,y){
  return (x-.5)*nx+(y-.5)*ny-c;
}

function isGreen(x,y){
  const z=zones[0];
  if(z.kind==='corner'){
    const margin=.34;
    if(z.corner===0)return x+y<margin;
    if(z.corner===1)return (1-x)+y<margin;
    if(z.corner===2)return (1-x)+(1-y)<margin;
    return x+(1-y)<margin;
  }
  return signed(z.nx,z.ny,z.c,x,y)*(z.greenPositive?1:-1)>0;
}

function drawZones(){
  if(!W||!H)return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='#292c32';
  ctx.fillRect(0,0,W,H);

  const z=zones[0];
  if(!z)return;

  if(z.kind==='half'){
    // Clip the canvas to the winning half-plane.
    ctx.save();
    ctx.beginPath();
    const points=[];
    const corners=[[0,0],[W,0],[W,H],[0,H]];
    function value(p){
      return signed(z.nx,z.ny,z.c,p[0]/W,p[1]/H)*
             (z.greenPositive?1:-1);
    }
    for(let i=0;i<4;i++){
      const a=corners[i],b=corners[(i+1)%4];
      const va=value(a),vb=value(b);
      if(va>=0)points.push(a);
      if((va<0&&vb>0)||(va>0&&vb<0)){
        const t=va/(va-vb);
        points.push([a[0]+(b[0]-a[0])*t,
                     a[1]+(b[1]-a[1])*t]);
      }
    }
    if(points.length){
      ctx.moveTo(points[0][0],points[0][1]);
      points.slice(1).forEach(p=>ctx.lineTo(p[0],p[1]));
      ctx.closePath();
      const g=ctx.createLinearGradient(0,0,W,H);
      g.addColorStop(0,'#20e88b');
      g.addColorStop(1,'#07985b');
      ctx.fillStyle=g;ctx.fill();
    }
    ctx.restore();
  }else{
    // Triangular winning corner.
    const m=.34;
    const corners=[
      [[0,0],[m*W,0],[0,m*H]],
      [[W,0],[(1-m)*W,0],[W,m*H]],
      [[W,H],[(1-m)*W,H],[W,(1-m)*H]],
      [[0,H],[m*W,H],[0,(1-m)*H]]
    ];
    const pts=corners[z.corner];
    ctx.beginPath();
    ctx.moveTo(pts[0][0],pts[0][1]);
    ctx.lineTo(pts[1][0],pts[1][1]);
    ctx.lineTo(pts[2][0],pts[2][1]);
    ctx.closePath();
    ctx.fillStyle='#12d981';
    ctx.fill();
  }
}

function placeIcons(){
  // Find one point in each zone, avoiding the central orb.
  let gp=null,dp=null;
  for(let i=0;i<1000&&(!gp||!dp);i++){
    const p={x:rand(.08,.92),y:rand(.08,.92)};
    if(Math.hypot(p.x-.5,p.y-.5)<.23)continue;
    if(isGreen(p.x,p.y))gp=gp||p;
    else dp=dp||p;
  }
  if(gp){
    winIcon.style.left=(gp.x*100)+'%';
    winIcon.style.top=(gp.y*100)+'%';
  }
  if(dp){
    loseIcon.style.left=(dp.x*100)+'%';
    loseIcon.style.top=(dp.y*100)+'%';
  }
}

function resetOrb(){
  orb.style.left='50%';
  orb.style.top='50%';
}

function updateStats(){
  document.getElementById('total').textContent=total;
  document.getElementById('wins').textContent=wins;
  document.getElementById('losses').textContent=losses;
  document.getElementById('actual').textContent=
    'Фактическая доля побед: '+(total?(wins/total*100).toFixed(2):'0')+'%';
}

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms));}

function animateOrb(start,end,duration,id){
  return new Promise(resolve=>{
    const control={
      x:clamp((start.x+end.x)/2+rand(-.22,.22),.05,.95),
      y:clamp((start.y+end.y)/2+rand(-.22,.22),.05,.95)
    };
    const t0=performance.now();

    function frame(now){
      if(id!==runId){resolve(false);return;}
      const t=clamp((now-t0)/duration,0,1);
      const e=1-Math.pow(1-t,3);
      const x=(1-e)*(1-e)*start.x+
              2*(1-e)*e*control.x+e*e*end.x;
      const y=(1-e)*(1-e)*start.y+
              2*(1-e)*e*control.y+e*e*end.y;
      orb.style.left=(x*100)+'%';
      orb.style.top=(y*100)+'%';
      if(t<1)requestAnimationFrame(frame);
      else resolve(true);
    }
    requestAnimationFrame(frame);
  });
}

async function playOne(id){
  // Probability is used to choose the result first.
  // The endpoint is then sampled from the matching zone.
  const chance=Number(chanceInput.value)/100;
  const win=Math.random()<chance;
  let end=null;

  for(let i=0;i<3000;i++){
    const p={x:rand(.04,.96),y:rand(.06,.94)};
    if(isGreen(p.x,p.y)===win){end=p;break;}
  }
  if(!end){
    end=win?{x:.1,y:.1}:{x:.9,y:.9};
    for(let i=0;i<300;i++){
      const p={x:rand(.04,.96),y:rand(.06,.94)};
      if(isGreen(p.x,p.y)===win){end=p;break;}
    }
  }

  const start={x:rand(.10,.90),y:rand(.10,.90)};
  orb.style.left=(start.x*100)+'%';
  orb.style.top=(start.y*100)+'%';
  statusEl.textContent='Шар движется…';

  const completed=await animateOrb(start,end,1700+Math.random()*800,id);
  if(!completed)return;

  total++;
  if(win){
    wins++;
    statusEl.textContent='ПОБЕДА — шар в зелёной зоне';
    statusEl.style.color='#18e58b';
  }else{
    losses++;
    statusEl.textContent='УБЫТОК — шар в тёмной зоне';
    statusEl.style.color='#ff7777';
  }
  updateStats();
}

async function runSeries(count){
  if(busy)return;
  busy=true;
  runId++;
  const id=runId;
  setButtons(true);

  for(let i=0;i<count;i++){
    if(id!==runId)break;
    // Every round gets a fresh random field.
    randomZones();
    await wait(250);
    await playOne(id);
    if(i<count-1)await wait(450);
  }
  busy=false;
  setButtons(false);
  if(id===runId)statusEl.textContent='Серия завершена';
}

function setButtons(disabled){
  document.getElementById('play').disabled=disabled;
  document.getElementById('batchPlay').disabled=disabled;
  document.getElementById('newZones').disabled=disabled;
}

chanceInput.addEventListener('input',()=>{
  chanceText.textContent=chanceInput.value+'%';
});

document.getElementById('play').addEventListener('click',()=>{
  runSeries(1);
});
document.getElementById('batchPlay').addEventListener('click',()=>{
  const count=clamp(parseInt(document.getElementById('batch').value)||1,1,100);
  runSeries(count);
});
document.getElementById('newZones').addEventListener('click',()=>{
  if(busy)return;
  randomZones();
  statusEl.style.color='#bbb';
  statusEl.textContent='Созданы новые случайные зоны';
});
document.getElementById('reset').addEventListener('click',()=>{
  if(busy)return;
  wins=losses=total=0;
  updateStats();
  statusEl.textContent='Статистика сброшена';
  statusEl.style.color='#bbb';
});

randomZones();
resize();
</script>
</body>
</html>
