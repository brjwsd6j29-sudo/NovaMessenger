<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RombGame — Краш</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== STYLE CONFIG ===== */
:root {
  --bg: #0B091A;
  --surface: #15122B;
  --surface-2: #1E1A3A;
  --border: #2C2754;
  --text: #F1EFFF;
  --text-muted: #837FA8;
  --violet: #7C5CFF;
  --violet-soft: #4B3FA0;
  --gold: #F5C94B;
  --crash: #FF4D6D;
  --cyan: #38E1C6;
  --radius: 16px;
  --font-display: 'Chakra Petch', sans-serif;
  --font-body: 'Inter', sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; height: 100%;
  background: radial-gradient(120% 120% at 50% -10%, #1c1842 0%, var(--bg) 60%);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button { font-family: inherit; cursor: pointer; border: none; outline: none; }
input { font-family: inherit; outline: none; }

.screen { min-height: 100vh; width: 100%; }

/* ===================== BRAND & BUTTONS ===================== */
.brand { display: flex; align-items: center; gap: 10px; }
.brand-gem { width: 28px; height: 28px; flex-shrink: 0; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.03em; }
.brand-sm .brand-gem { width: 24px; height: 24px; }

.btn {
  border-radius: 12px; padding: 13px 20px;
  font-weight: 600; font-size: 0.95rem;
  transition: transform .1s ease, opacity .12s ease, background .2s ease;
}
.btn:active { transform: scale(0.97); }
.btn-block { width: 100%; }
.btn-primary {
  background: linear-gradient(135deg, #8C62FF, #5B3FE0);
  color: #fff;
  box-shadow: 0 6px 20px -6px rgba(124,92,255,0.5);
}
.btn-ghost {
  background: transparent; color: var(--text-muted); border: 1px solid var(--border);
}
.btn-ghost:hover { color: var(--text); border-color: var(--violet-soft); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

/* ===================== ЭКРАН ВХОДА ===================== */
.login-screen {
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.login-card {
  width: 100%; max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 24px; text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.login-card .brand { justify-content: center; margin-bottom: 24px; }
.login-card h1 { font-family: var(--font-display); font-size: 1.4rem; margin: 0 0 8px; }
.login-hint { color: var(--text-muted); font-size: 0.85rem; line-height: 1.5; margin: 0 0 20px; }
.pincode-input {
  width: 100%; text-align: center;
  font-family: var(--font-display); font-size: 1.6rem; letter-spacing: 0.3em;
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px;
  color: var(--text); padding: 12px; margin-bottom: 16px;
  transition: border-color 0.2s ease;
}
.pincode-input:focus { border-color: var(--violet); }
.login-error { color: var(--crash); font-size: 0.85rem; margin-top: 12px; }

/* ===================== TOPBAR ===================== */
.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px; position: relative;
  border-bottom: 1px solid var(--border);
  background: rgba(21, 18, 43, 0.8);
  backdrop-filter: blur(10px);
}
.profile-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
  padding: 6px 14px 6px 8px; color: var(--text);
}
.profile-balance {
  display: flex; align-items: center; gap: 6px;
  background: var(--surface-2); border-radius: 999px; padding: 4px 10px;
  font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; color: var(--gold);
  transition: transform 0.2s ease;
}
.profile-name { font-size: 0.85rem; color: var(--text-muted); max-width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.profile-dropdown {
  position: absolute; top: 60px; right: 20px; z-index: 20;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px; width: 210px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.6);
}
.pd-row { display: flex; justify-content: space-between; font-size: 0.85rem; padding: 6px 0; color: var(--text-muted); }
.pd-row b { color: var(--text); font-family: var(--font-display); }

/* ===================== МЕНЮ ===================== */
.menu-view { max-width: 480px; margin: 0 auto; padding: 28px 20px; }
.menu-title { font-family: var(--font-display); font-size: 1.1rem; color: var(--text-muted); margin: 0 0 16px; }
.game-card {
  width: 100%; display: flex; align-items: center; gap: 16px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px; text-align: left; color: inherit;
  transition: border-color .15s ease, transform .12s ease;
}
.game-card:hover { border-color: var(--violet-soft); transform: translateY(-2px); }
.game-card-icon { font-size: 1.8rem; width: 44px; text-align: center; }
.game-card-body { flex: 1; }
.game-card-name { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; }
.game-card-desc { font-size: 0.8rem; color: var(--text-muted); margin-top: 2px; }

/* ===================== КРАШ ИГРА ===================== */
.crash-view {
  max-width: 480px; margin: 0 auto; padding: 14px 16px 24px;
  display: flex; flex-direction: column; gap: 12px;
}
.back-btn { align-self: flex-start; background: none; color: var(--text-muted); font-size: 0.85rem; padding: 4px 0; }
.back-btn:hover { color: var(--text); }

.history-strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.history-strip::-webkit-scrollbar { display: none; }
.history-chip {
  flex-shrink: 0; font-family: var(--font-display); font-weight: 700; font-size: 0.78rem;
  padding: 5px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border);
}
.hc-low { color: var(--text-muted); }
.hc-mid { color: var(--gold); border-color: rgba(245,201,75,0.3); }
.hc-high { color: var(--violet); border-color: rgba(124,92,255,0.5); }

.stage {
  position: relative; height: 260px;
  background: linear-gradient(180deg, #181438 0%, #0E0C22 100%);
  border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden;
}
#rocketCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.stage-overlay {
  position: absolute; inset: 0; display: flex; flex-direction: column;
  align-items: center; justify-content: center; pointer-events: none;
}
.phase-label { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
.multiplier-value {
  font-family: var(--font-display); font-weight: 700; font-size: 3.2rem;
  color: var(--text); transition: color .15s ease;
}
.multiplier-value.mv-running { color: var(--violet); text-shadow: 0 0 25px rgba(124,92,255,0.4); }
.multiplier-value.mv-crashed { color: var(--crash); text-shadow: 0 0 25px rgba(255,77,109,0.5); }
.countdown-value { font-family: var(--font-display); font-size: 1.5rem; color: var(--gold); margin-top: 4px; }

/* ПАНЕЛЬ СТАВОК */
.bet-panel {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
}
.bet-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.bet-label { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
.bet-input-group { display: flex; align-items: center; gap: 6px; flex: 1; justify-content: flex-end; }
.bet-input {
  width: 95px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
  color: var(--text); font-family: var(--font-display); font-weight: 700; padding: 8px; text-align: right;
}
.bet-input:focus { border-color: var(--violet); }
.qbtn {
  background: var(--surface-2); border: 1px solid var(--border); color: var(--text-muted);
  border-radius: 8px; padding: 8px 10px; font-size: 0.75rem; font-weight: 700;
}
.qbtn:hover { color: var(--text); border-color: var(--violet-soft); }

.switch { position: relative; display: inline-block; width: 34px; height: 18px; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch-track {
  position: absolute; inset: 0; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 999px; transition: background .2s ease;
}
.switch-track::before {
  content: ""; position: absolute; width: 12px; height: 12px; left: 2px; top: 2px;
  background: var(--text-muted); border-radius: 50%; transition: transform .2s ease;
}
.switch input:checked + .switch-track { background: var(--violet-soft); border-color: var(--violet); }
.switch input:checked + .switch-track::before { transform: translateX(16px); background: #fff; }

.btn-action {
  background: linear-gradient(135deg, #8C62FF, #5B3FE0); color: #fff;
  font-size: 1rem; padding: 14px; border-radius: 12px; font-weight: 700;
}
.btn-action.state-cashout { background: linear-gradient(135deg, #FFD873, #F5C94B); color: #201700; }
.btn-action.state-locked { background: var(--surface-2); color: var(--text-muted); }

.bet-error { color: var(--crash); font-size: 0.8rem; text-align: center; margin: 0; }

/* УВЕДОМЛЕНИЕ О ВЫИГРЫШЕ */
.win-toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--gold);
  border-radius: 14px; padding: 12px 20px; z-index: 100;
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  opacity: 0; pointer-events: none; transition: all .25s ease;
}
.win-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.win-toast-title { font-family: var(--font-display); font-weight: 700; color: var(--gold); }
.win-toast-sub { font-size: 0.82rem; color: var(--text-muted); }

.balance-pulse { animation: pulseGreen 0.6s ease; }
@keyframes pulseGreen {
  0% { transform: scale(1); }
  50% { color: #6BFFA0; transform: scale(1.15); }
  100% { transform: scale(1); }
}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="loginScreen" class="screen login-screen">
  <div class="login-card">
    <div class="brand">
      <svg class="brand-gem" viewBox="0 0 40 40"><path d="M20 2 L36 14 L20 38 L4 14 Z" fill="#7C5CFF"/></svg>
      <span class="brand-name">RombGame</span>
    </div>
    <h1>Вход в аккаунт</h1>
    <p class="login-hint">Отправьте боту <b>/mypincode</b>, чтобы получить код доступа.</p>
    <form id="loginForm" autocomplete="off">
      <input id="pincodeInput" class="pincode-input" inputmode="numeric" maxlength="6" placeholder="• • • • • •">
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>
    <p id="loginError" class="login-error" hidden></p>
  </div>
</div>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<div id="app" class="screen" hidden>
  <header class="topbar">
    <div class="brand brand-sm">
      <svg class="brand-gem" viewBox="0 0 40 40"><path d="M20 2 L36 14 L20 38 L4 14 Z" fill="#7C5CFF"/></svg>
      <span class="brand-name">RombGame</span>
    </div>
    <button id="profileChip" class="profile-chip">
      <span class="profile-balance" id="balanceContainer">
        <span id="balanceValue">0</span> 💎
      </span>
      <span class="profile-name" id="nicknameValue">Игрок</span>
    </button>

    <div id="profileDropdown" class="profile-dropdown" hidden>
      <div class="pd-row"><span>Баланс</span><b id="pdBalance">0</b></div>
      <div class="pd-row"><span>Уровень</span><b id="pdLvl">1</b></div>
      <button id="logoutBtn" class="btn btn-ghost btn-block" style="margin-top:10px;">Выйти</button>
    </div>
  </header>

  <!-- МЕНЮ -->
  <main id="menuView" class="menu-view">
    <h2 class="menu-title">Выберите игру</h2>
    <button id="openCrashBtn" class="game-card">
      <div class="game-card-icon">🚀</div>
      <div class="game-card-body">
        <div class="game-card-name">Краш</div>
        <div class="game-card-desc">Успей забрать выигрыш до падения ракеты</div>
      </div>
    </button>
  </main>

  <!-- КРАШ -->
  <main id="crashView" class="crash-view" hidden>
    <button id="backToMenuBtn" class="back-btn">← В меню</button>
    <div class="history-strip" id="historyStrip"></div>

    <div class="stage">
      <canvas id="rocketCanvas"></canvas>
      <div class="stage-overlay">
        <div id="phaseLabel" class="phase-label">Ожидание...</div>
        <div id="multiplierValue" class="multiplier-value">1.00x</div>
        <div id="countdownValue" class="countdown-value"></div>
      </div>
    </div>

    <div class="bet-panel">
      <div class="bet-row">
        <label class="bet-label">Ставка</label>
        <div class="bet-input-group">
          <button class="qbtn" data-op="half">½</button>
          <input id="betAmountInput" type="number" min="100" step="100" value="100" class="bet-input">
          <button class="qbtn" data-op="double">2×</button>
          <button class="qbtn" data-op="max">MAX</button>
        </div>
      </div>

      <div class="bet-row">
        <label class="bet-label">
          <span class="switch">
            <input type="checkbox" id="autoCashoutToggle">
            <span class="switch-track"></span>
          </span>
          Автозабор
        </label>
        <input id="autoCashoutInput" type="number" min="1.01" step="0.01" value="2.00" class="bet-input" disabled>
      </div>

      <button id="actionBtn" class="btn btn-action" disabled>Подключение...</button>
      <p id="betError" class="bet-error" hidden></p>
    </div>
  </main>
</div>

<!-- ТОСТ -->
<div id="winToast" class="win-toast" hidden>
  <div style="font-size: 1.5rem">💎</div>
  <div>
    <div class="win-toast-title">Забрано!</div>
    <div class="win-toast-sub"><span id="winMult">1.00x</span> | +<span id="winAmount">0</span></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const API_BASE_URL = "https://follows-spanking-chicken-shadows.trycloudflare.com";

  function apiUrl(p) { return API_BASE_URL.replace(/\/$/, "") + p; }
  function apiHeaders(extra = {}) {
    const headers = { ...extra };
    const t = localStorage.getItem("romb_session_token");
    if (t) headers["Authorization"] = `Bearer ${t}`;
    return headers;
  }

  // DOM Elements
  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("app");
  const pincodeInput = document.getElementById("pincodeInput");
  const loginError = document.getElementById("loginError");
  const balanceValue = document.getElementById("balanceValue");
  const balanceContainer = document.getElementById("balanceContainer");
  const nicknameValue = document.getElementById("nicknameValue");
  const profileChip = document.getElementById("profileChip");
  const profileDropdown = document.getElementById("profileDropdown");

  const menuView = document.getElementById("menuView");
  const crashView = document.getElementById("crashView");
  const rocketCanvas = document.getElementById("rocketCanvas");
  const rctx = rocketCanvas.getContext("2d");

  const betAmountInput = document.getElementById("betAmountInput");
  const autoCashoutToggle = document.getElementById("autoCashoutToggle");
  const autoCashoutInput = document.getElementById("autoCashoutInput");
  const actionBtn = document.getElementById("actionBtn");
  const betError = document.getElementById("betError");

  // State
  let profile = null;
  let ws = null;
  let currentState = null;
  let myBetPlaced = false;
  let myBetActive = false;
  let lastSeenRoundId = null;
  let curvePoints = [];
  let isRequestPending = false;

  function fmt(n) { return Math.round(n || 0).toLocaleString("ru-RU"); }

  // --- ВХОД И ПРОФИЛЬ ---
  pincodeInput.addEventListener("input", () => {
    pincodeInput.value = pincodeInput.value.replace(/\D/g, "").slice(0, 6);
  });

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.hidden = true;
    const pincode = pincodeInput.value.trim();
    if (pincode.length !== 6) return showError("Введите 6 цифр кода");

    try {
      const res = await fetch(apiUrl("/api/login"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pincode })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || "Ошибка входа");
      
      if (data.token) localStorage.setItem("romb_session_token", data.token);
      await fetchProfile();
      showApp();
    } catch (err) {
      showError(err.message);
    }
  });

  function showError(msg) {
    loginError.textContent = msg;
    loginError.hidden = false;
  }

  async function fetchProfile() {
    try {
      const res = await fetch(apiUrl("/api/profile"), { headers: apiHeaders() });
      if (!res.ok) throw new Error();
      profile = await res.json();
      renderProfile();
    } catch {
      localStorage.removeItem("romb_session_token");
      loginScreen.hidden = false;
      appScreen.hidden = true;
    }
  }

  function renderProfile(animate = false) {
    if (!profile) return;
    nicknameValue.textContent = profile.nickname;
    document.getElementById("pdLvl").textContent = profile.lvl;
    document.getElementById("pdBalance").textContent = fmt(profile.balance);
    
    if (animate) {
      balanceContainer.classList.remove("balance-pulse");
      void balanceContainer.offsetWidth;
      balanceContainer.classList.add("balance-pulse");
    }
    balanceValue.textContent = fmt(profile.balance);
  }

  function showApp() {
    loginScreen.hidden = true;
    appScreen.hidden = false;
    connectWS();
  }

  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("romb_session_token");
    location.reload();
  });

  profileChip.addEventListener("click", () => {
    profileDropdown.hidden = !profileDropdown.hidden;
  });

  // --- НАВИГАЦИЯ ---
  document.getElementById("openCrashBtn").addEventListener("click", () => {
    menuView.hidden = true; crashView.hidden = false;
    resizeCanvas();
  });
  document.getElementById("backToMenuBtn").addEventListener("click", () => {
    crashView.hidden = true; menuView.hidden = false;
  });

  // --- СТАВКИ И ИНТЕРФЕЙС ---
  document.querySelectorAll(".qbtn").forEach(btn => {
    btn.addEventListener("click", () => {
      const cur = parseInt(betAmountInput.value || "0", 10);
      const bal = profile ? profile.balance : 0;
      if (btn.dataset.op === "half") betAmountInput.value = Math.max(100, Math.floor(cur / 2));
      if (btn.dataset.op === "double") betAmountInput.value = Math.min(bal, (cur || 100) * 2);
      if (btn.dataset.op === "max") betAmountInput.value = bal;
    });
  });

  autoCashoutToggle.addEventListener("change", () => {
    autoCashoutInput.disabled = !autoCashoutToggle.checked;
  });

  // --- WEBSOCKET И ИГРОВАЯ ЛОГИКА ---
  function connectWS() {
    const wsBase = API_BASE_URL.replace(/^http/, "ws").replace(/\/$/, "");
    ws = new WebSocket(`${wsBase}/ws/crash`);
    
    ws.onmessage = (evt) => {
      const state = JSON.parse(evt.data);
      handleState(state);
    };
    ws.onclose = () => setTimeout(connectWS, 2000);
  }

  function handleState(state) {
    currentState = state;

    if (state.round_id !== lastSeenRoundId) {
      lastSeenRoundId = state.round_id;
      myBetPlaced = false;
      myBetActive = false;
      curvePoints = [];
      betError.hidden = true;
    }

    // Автоматическая проверка: если сервер сообщает, что автозабор сработал
    if (state.user_cashout && myBetActive) {
      myBetActive = false;
      fetchProfile();
      showWinToast(state.user_cashout.multiplier, state.user_cashout.win);
    }

    renderHistory(state.history || []);
    renderPhase(state);
    drawRocket(state);
  }

  function renderHistory(history) {
    const strip = document.getElementById("historyStrip");
    strip.innerHTML = "";
    history.forEach(val => {
      const chip = document.createElement("div");
      const cls = val >= 10 ? "hc-high" : val >= 2 ? "hc-mid" : "hc-low";
      chip.className = `history-chip ${cls}`;
      chip.textContent = `${val.toFixed(2)}x`;
      strip.appendChild(chip);
    });
  }

  function renderPhase(state) {
    const phaseLabel = document.getElementById("phaseLabel");
    const multVal = document.getElementById("multiplierValue");
    const countVal = document.getElementById("countdownValue");

    multVal.classList.remove("mv-running", "mv-crashed");

    if (state.phase === "waiting") {
      phaseLabel.textContent = "Приём ставок";
      multVal.textContent = "1.00x";
      countVal.textContent = Math.max(0, Math.ceil(state.phase_ends_in || 0)) + "s";
      updateActionButton("waiting");
    } else if (state.phase === "running") {
      phaseLabel.textContent = "Полёт";
      multVal.classList.add("mv-running");
      multVal.textContent = `${state.multiplier.toFixed(2)}x`;
      countVal.textContent = "";
      updateActionButton("running", state.multiplier);
    } else if (state.phase === "crashed") {
      phaseLabel.textContent = "Краш!";
      multVal.classList.add("mv-crashed");
      multVal.textContent = `${(state.crash_point || 1.0).toFixed(2)}x`;
      countVal.textContent = "";
      
      if (myBetActive) {
        myBetActive = false;
        betError.textContent = "Ставка сгорела!";
        betError.hidden = false;
        fetchProfile();
      }
      updateActionButton("crashed");
    }
  }

  function updateActionButton(phase, mult = 1) {
    actionBtn.classList.remove("state-cashout", "state-locked");

    if (phase === "waiting") {
      if (myBetPlaced) {
        actionBtn.textContent = "Ставка сделана ✓";
        actionBtn.classList.add("state-locked");
        actionBtn.disabled = true;
      } else {
        actionBtn.textContent = "Поставить";
        actionBtn.disabled = isRequestPending;
      }
    } else if (phase === "running") {
      if (myBetActive) {
        const bet = parseInt(betAmountInput.value || "0", 10);
        actionBtn.textContent = `Забрать ${fmt(bet * mult)}`;
        actionBtn.classList.add("state-cashout");
        actionBtn.disabled = isRequestPending;
      } else {
        actionBtn.textContent = myBetPlaced ? "Забрано" : "Идёт раунд";
        actionBtn.classList.add("state-locked");
        actionBtn.disabled = true;
      }
    } else {
      actionBtn.textContent = "Ожидание раунда";
      actionBtn.classList.add("state-locked");
      actionBtn.disabled = true;
    }
  }

  // --- ДЕЙСТВИЯ: СТАВКА / ЗАБОР ---
  actionBtn.addEventListener("click", async () => {
    if (!currentState || isRequestPending) return;
    betError.hidden = true;

    if (currentState.phase === "waiting" && !myBetPlaced) {
      const amount = parseInt(betAmountInput.value || "0", 10);
      if (isNaN(amount) || amount < 100) return showErrorBet("Мин. ставка: 100");

      const payload = { amount };
      if (autoCashoutToggle.checked) {
        payload.auto_cashout = parseFloat(autoCashoutInput.value || "0");
      }

      isRequestPending = true;
      actionBtn.disabled = true;

      try {
        const res = await fetch(apiUrl("/api/crash/bet"), {
          method: "POST",
          headers: apiHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Ошибка");

        profile.balance = data.balance;
        renderProfile();
        myBetPlaced = true;
        myBetActive = true;
        updateActionButton("waiting");
      } catch (err) {
        showErrorBet(err.message);
      } finally {
        isRequestPending = false;
      }

    } else if (currentState.phase === "running" && myBetActive) {
      isRequestPending = true;
      actionBtn.disabled = true;

      try {
        const res = await fetch(apiUrl("/api/crash/cashout"), { method: "POST", headers: apiHeaders() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Не удалось забрать");

        myBetActive = false;
        profile.balance = data.balance;
        renderProfile(true);
        updateActionButton("running", currentState.multiplier);
        showWinToast(data.multiplier, data.win);
      } catch (err) {
        showErrorBet(err.message);
      } finally {
        isRequestPending = false;
      }
    }
  });

  function showErrorBet(msg) {
    betError.textContent = msg;
    betError.hidden = false;
  }

  function showWinToast(mult, win) {
    document.getElementById("winMult").textContent = `${mult.toFixed(2)}x`;
    document.getElementById("winAmount").textContent = fmt(win);
    const toast = document.getElementById("winToast");
    toast.hidden = false;
    requestAnimationFrame(() => toast.classList.add("show"));
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => { toast.hidden = true; }, 300);
    }, 2500);
  }

  // --- CANVAS РИСОВАНИЕ ---
  function resizeCanvas() {
    const rect = rocketCanvas.parentElement.getBoundingClientRect();
    rocketCanvas.width = rect.width;
    rocketCanvas.height = rect.height;
  }
  window.addEventListener("resize", resizeCanvas);

  function drawRocket(state) {
    if (crashView.hidden) return;
    const w = rocketCanvas.width;
    const h = rocketCanvas.height;
    rctx.clearRect(0, 0, w, h);

    if (state.phase === "waiting") {
      curvePoints = [];
      return;
    }

    const mult = state.phase === "crashed" ? state.crash_point : state.multiplier;
    curvePoints.push(mult);
    if (curvePoints.length > 150) curvePoints.shift();

    const maxM = Math.max(2, mult * 1.1);
    const pad = 20;

    rctx.beginPath();
    curvePoints.forEach((m, i) => {
      const x = pad + (i / Math.max(1, curvePoints.length - 1)) * (w - pad * 2);
      const y = h - pad - (Math.min(m, maxM) / maxM) * (h - pad * 2);
      if (i === 0) rctx.moveTo(x, y);
      else rctx.lineTo(x, y);
    });

    rctx.strokeStyle = state.phase === "crashed" ? "#FF4D6D" : "#7C5CFF";
    rctx.lineWidth = 3;
    rctx.stroke();

    // Точка ракеты
    if (curvePoints.length > 0) {
      const lastM = curvePoints[curvePoints.length - 1];
      const x = pad + (w - pad * 2);
      const y = h - pad - (Math.min(lastM, maxM) / maxM) * (h - pad * 2);

      rctx.beginPath();
      rctx.arc(x, y, 6, 0, Math.PI * 2);
      rctx.fillStyle = state.phase === "crashed" ? "#FF4D6D" : "#F5C94B";
      rctx.fill();
    }
  }

  // Запуск при старте
  if (localStorage.getItem("romb_session_token")) {
    fetchProfile().then(() => {
      if (profile) showApp();
    });
  }
})();
</script>
