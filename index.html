<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Lira Games WebApp</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #12131C;
            --card-bg: #1E202E;
            --accent-color: #0088cc;
            --accent-hover: #00A3E0;
            --text-color: #FFFFFF;
            --text-secondary: #8E92A8;
            --win-color: #2ECC71;
            --lose-color: #E74C3C;
            --gold-color: #F1C40F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Заглушка для обычного браузера */
        #access-denied {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100vh;
            padding: 20px;
        }

        #access-denied div.icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        #access-denied h1 {
            font-size: 22px;
            color: var(--lose-color);
            margin-bottom: 10px;
        }

        #access-denied p {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.5;
        }

        /* Основной контейнер WebApp */
        #app {
            display: none;
            width: 100%;
            max-width: 400px;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .user-info {
            background: var(--card-bg);
            padding: 10px 16px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        /* Контейнер игры */
        .game-card {
            background: var(--card-bg);
            width: 100%;
            border-radius: 20px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            position: relative;
        }

        .game-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-color);
        }

        /* Анимация и монета */
        .coin-container {
            width: 120px;
            height: 120px;
            perspective: 1000px;
            margin: 20px 0 30px 0;
        }

        .coin {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .coin-side {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            font-weight: bold;
            border: 4px solid #E67E22;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3), 0 4px 10px rgba(0,0,0,0.5);
        }

        .heads {
            background: linear-gradient(135deg, #F1C40F, #F39C12);
            color: #FFF;
        }

        .tails {
            background: linear-gradient(135deg, #BDC3C7, #2C3E50);
            color: #FFF;
            transform: rotateY(180deg);
        }

        /* Кнопки и выбор */
        .choice-container {
            display: flex;
            gap: 12px;
            width: 100%;
            margin-bottom: 20px;
        }

        .btn-choice {
            flex: 1;
            padding: 12px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            color: var(--text-color);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-choice.active {
            border-color: var(--accent-color);
            background: rgba(0, 136, 204, 0.15);
            color: var(--accent-color);
        }

        /* Поле ввода ставки */
        .bet-container {
            width: 100%;
            margin-bottom: 20px;
        }

        .bet-container label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .bet-input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            color: #FFF;
            font-size: 16px;
            font-weight: bold;
            outline: none;
            text-align: center;
        }

        /* Главная кнопка броска */
        .btn-flip {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-color), #005580);
            color: #FFF;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .btn-flip:active {
            transform: scale(0.98);
        }

        .btn-flip:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Отображение результата */
        .result-message {
            margin-top: 15px;
            font-weight: bold;
            font-size: 16px;
            min-height: 22px;
            text-align: center;
        }

        .win { color: var(--win-color); }
        .lose { color: var(--lose-color); }
    </style>
</head>
<body>

    <div id="access-denied">
        <div class="icon">🚫</div>
        <h1>Доступ ограничен</h1>
        <p>Запуск приложения возможен только через официального бота в Telegram.</p>
    </div>

    <div id="app">
        <div class="header">
            <div class="user-info">
                <span>👤</span>
                <span id="user-name">Игрок</span>
            </div>
        </div>

        <div class="game-card">
            <div class="game-title">FLIP (Орёл / Решка)</div>

            <div class="coin-container">
                <div class="coin" id="coin">
                    <div class="coin-side heads">🦅</div>
                    <div class="coin-side tails">🪙</div>
                </div>
            </div>

            <div class="choice-container">
                <button class="btn-choice active" id="btn-heads" onclick="selectChoice('heads')">🦅 Орёл</button>
                <button class="btn-choice" id="btn-tails" onclick="selectChoice('tails')">🪙 Решка</button>
            </div>

            <div class="bet-container">
                <label for="bet-amount">Сумма ставки (ромб):</label>
                <input type="number" id="bet-amount" class="bet-input" value="1000" min="100" step="100">
            </div>

            <button class="btn-flip" id="btn-spin" onclick="playFlip()">БРОСИТЬ МОНЕТУ</button>

            <div class="result-message" id="result"></div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;

        let selectedChoice = 'heads'; // Выбранная сторона
        let currentRotation = 0;       // Текущий угол поворота монеты
        let isProcessing = false;      // Флаг анимации

        // Валидация доступа: проверка запуска внутри Telegram
        function validateTelegramContext() {
            // Если initData или initDataUnsafe пусты — вход был осуществлён через браузер
            if (!tg.initData || tg.initData === "") {
                document.getElementById('access-denied').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
                return false;
            }

            // Уведомляем Telegram, что приложение готово
            tg.ready();
            tg.expand(); // Разворачиваем на весь экран

            // Отображение имени пользователя
            const user = tg.initDataUnsafe.user;
            if (user) {
                document.getElementById('user-name').innerText = user.first_name || "Игрок";
            }

            document.getElementById('access-denied').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            return true;
        }

        // Выбор Орёл / Решка
        function selectChoice(choice) {
            if (isProcessing) return;
            selectedChoice = choice;
            
            document.getElementById('btn-heads').classList.toggle('active', choice === 'heads');
            document.getElementById('btn-tails').classList.toggle('active', choice === 'tails');
        }

        // Логика броска
        function playFlip() {
            if (isProcessing) return;

            const betInput = document.getElementById('bet-amount');
            const betValue = parseInt(betInput.value);

            if (isNaN(betValue) || betValue <= 0) {
                tg.showAlert("Введите корректную сумму ставки!");
                return;
            }

            isProcessing = true;
            document.getElementById('btn-spin').disabled = true;
            document.getElementById('result').innerText = "";
            document.getElementById('result').className = "result-message";

            // Генерация исхода (50% шанс на стороне клиенте для теста)
            const outcome = Math.random() < 0.5 ? 'heads' : 'tails';

            // Вычисление градусов вращения (минимум 5 полных оборотов = 1800°)
            const extraRounds = 5 * 360;
            let targetDegree = currentRotation + extraRounds;
            
            // Выравниваем градусы для нужной стороны
            const remainder = targetDegree % 360;
            if (outcome === 'heads') {
                targetDegree += (360 - remainder);
            } else {
                targetDegree += (180 - remainder);
            }

            currentRotation = targetDegree;

            // Запуск анимации
            const coinEl = document.getElementById('coin');
            coinEl.style.transform = `rotateY(${targetDegree}deg)`;

            // Подведение итогов по завершении анимации (3 сек)
            setTimeout(() => {
                const isWin = (selectedChoice === outcome);
                const resultEl = document.getElementById('result');

                if (isWin) {
                    const winAmount = betValue * 2;
                    resultEl.innerText = `🎉 Вы выиграли ${winAmount.toLocaleString()} ромб!`;
                    resultEl.classList.add('win');
                    tg.HapticFeedback.notificationOccurred('success');
                } else {
                    resultEl.innerText = `❌ Вы проиграли ${betValue.toLocaleString()} ромб!`;
                    resultEl.classList.add('lose');
                    tg.HapticFeedback.notificationOccurred('error');
                }

                // Отправка результатов обратно боту (при необходимости)
                /*
                tg.sendData(JSON.stringify({
                    game: "flip",
                    bet: betValue,
                    choice: selectedChoice,
                    outcome: outcome,
                    win: isWin
                }));
                */

                isProcessing = false;
                document.getElementById('btn-spin').disabled = false;
            }, 3000);
        }

        // Запуск проверки контекста при загрузке страницы
        window.addEventListener('DOMContentLoaded', validateTelegramContext);
    </script>
</body>
</html>
