<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Crash Demo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080a0f;
    color: #fff;
    font-family: Arial, sans-serif;
}

.header {
    height: 65px;
    padding: 0 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0e1118;
    border-bottom: 1px solid #202530;
}

.logo {
    font-size: 22px;
    font-weight: 800;
}

.balance {
    background: #171c25;
    padding: 10px 15px;
    border-radius: 12px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.game {
    background: #0e1118;
    border: 1px solid #202530;
    border-radius: 18px;
    padding: 25px;
    text-align: center;
}

.multiplier {
    font-size: 64px;
    font-weight: 900;
    margin: 50px 0;
}

.status {
    color: #8993a5;
    margin-bottom: 20px;
}

.progress {
    width: 100%;
    height: 5px;
    background: #202530;
    border-radius: 5px;
    overflow: hidden;
}

.progress div {
    width: 0%;
    height: 100%;
    background: #42d392;
    transition: width .1s linear;
}

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 20px;
}

input, select, button {
    width: 100%;
    padding: 14px;
    border-radius: 12px;
    border: 1px solid #2a303c;
    background: #171c25;
    color: white;
    font-size: 16px;
}

button {
    cursor: pointer;
    background: #42d392;
    color: #07100b;
    border: none;
    font-weight: 800;
}

button:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.auto {
    margin-top: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #171c25;
    padding: 14px;
    border-radius: 12px;
}

.auto input {
    width: auto;
}

.cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 20px;
}

.card {
    background: #0e1118;
    border: 1px solid #202530;
    border-radius: 18px;
    padding: 20px;
}

.card h3 {
    margin-top: 0;
}

.history {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

.history span {
    padding: 8px 11px;
    background: #171c25;
    border-radius: 8px;
    color: #72e6aa;
}

.players {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.player {
    display: flex;
    justify-content: space-between;
    background: #171c25;
    padding: 12px;
    border-radius: 10px;
}

.green {
    color: #72e6aa;
}

.red {
    color: #ff6875;
}

@media(max-width:700px) {
    .cards,
    .controls {
        grid-template-columns: 1fr;
    }

    .multiplier {
        font-size: 48px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">🚀 Crash Demo</div>

    <div class="balance">
        ⭐ <span id="balance">100000</span>
    </div>
</header>

<div class="container">

    <div class="game">

        <div class="status" id="status">
            Нажми «Старт»
        </div>

        <div class="multiplier" id="multiplier">
            1.00x
        </div>

        <div class="progress">
            <div id="progress"></div>
        </div>

        <div class="controls">

            <input
                id="demoPoints"
                type="number"
                min="1"
                value="1000"
                placeholder="Количество очков"
            >

            <button id="startBtn">
                🚀 Старт
            </button>

        </div>

        <div class="auto">

            <input
                type="checkbox"
                id="autoStop"
            >

            <label for="autoStop">
                Автозавершение
            </label>

            <select id="autoMultiplier" disabled>
                <option value="1.5">1.50x</option>
                <option value="2">2.00x</option>
                <option value="3">3.00x</option>
                <option value="5">5.00x</option>
                <option value="10">10.00x</option>
            </select>

        </div>

        <button
            id="stopBtn"
            disabled
            style="margin-top:15px;"
        >
            ✋ Завершить раунд
        </button>

    </div>


    <div class="cards">

        <div class="card">

            <h3>👥 Активные игроки</h3>

            <div class="players" id="players"></div>

        </div>


        <div class="card">

            <h3>📊 История</h3>

            <div
                class="history"
                id="history"
            ></div>

        </div>

    </div>

</div>


<script>

let balance = 100000;

let multiplier = 1.00;

let running = false;

let interval = null;

let crashPoint = 0;

let history = [
    1.42,
    2.18,
    1.08,
    4.72,
    2.91,
    1.63,
    7.24
];

const balanceEl =
    document.getElementById("balance");

const multiplierEl =
    document.getElementById("multiplier");

const statusEl =
    document.getElementById("status");

const progressEl =
    document.getElementById("progress");

const startBtn =
    document.getElementById("startBtn");

const stopBtn =
    document.getElementById("stopBtn");

const autoStop =
    document.getElementById("autoStop");

const autoMultiplier =
    document.getElementById("autoMultiplier");

const historyEl =
    document.getElementById("history");

const playersEl =
    document.getElementById("players");


function updateBalance() {

    balanceEl.textContent =
        balance.toLocaleString("ru-RU");

}


function renderHistory() {

    historyEl.innerHTML = "";

    history.slice(0, 12).forEach(value => {

        const span =
            document.createElement("span");

        span.textContent =
            value.toFixed(2) + "x";

        historyEl.appendChild(span);

    });

}


function randomCrash() {

    const values = [
        1.08,
        1.21,
        1.43,
        1.76,
        2.15,
        2.83,
        3.44,
        4.75,
        6.20,
        8.40
    ];

    return values[
        Math.floor(
            Math.random() * values.length
        )
    ];

}


function startGame() {

    if (running) return;

    running = true;

    multiplier = 1;

    crashPoint =
        randomCrash();

    multiplierEl.textContent =
        "1.00x";

    statusEl.textContent =
        "🚀 Раунд идёт...";

    startBtn.disabled = true;

    stopBtn.disabled = false;

    progressEl.style.width = "0%";

    interval = setInterval(() => {

        multiplier += 0.01;

        multiplierEl.textContent =
            multiplier.toFixed(2) + "x";

        progressEl.style.width =
            Math.min(multiplier * 8, 100) + "%";


        if (
            autoStop.checked &&
            multiplier >=
            Number(autoMultiplier.value)
        ) {

            stopGame();

            return;

        }


        if (
            multiplier >= crashPoint
        ) {

            crash();

        }

    }, 50);

}


function stopGame() {

    if (!running) return;

    clearInterval(interval);

    running = false;

    statusEl.textContent =
        "✅ Раунд завершён";

    stopBtn.disabled = true;

    startBtn.disabled = false;

    history.unshift(multiplier);

    renderHistory();

}


function crash() {

    clearInterval(interval);

    running = false;

    multiplierEl.textContent =
        crashPoint.toFixed(2) + "x";

    statusEl.textContent =
        "💥 Краш на " +
        crashPoint.toFixed(2) +
        "x";

    stopBtn.disabled = true;

    startBtn.disabled = false;

    history.unshift(crashPoint);

    renderHistory();

}


startBtn.addEventListener(
    "click",
    startGame
);


stopBtn.addEventListener(
    "click",
    stopGame
);


autoStop.addEventListener(
    "change",
    () => {

        autoMultiplier.disabled =
            !autoStop.checked;

    }
);


function renderPlayers() {

    const players = [
        ["Alex", 2.14],
        ["Maks", 1.72],
        ["Dima", 3.41],
        ["Lira", 1.29],
        ["Nazar", 4.08]
    ];

    playersEl.innerHTML = "";

    players.forEach(player => {

        const div =
            document.createElement("div");

        div.className = "player";

        div.innerHTML = `
            <span>👤 ${player[0]}</span>
            <span class="green">
                ${player[1].toFixed(2)}x
            </span>
        `;

        playersEl.appendChild(div);

    });

}


updateBalance();

renderHistory();

renderPlayers();

</script>

</body>
</html>
