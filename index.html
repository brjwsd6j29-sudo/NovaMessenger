<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>11 сынып — Тақырыптық тест</title>

<style>
:root{
  --bg:#06080d;
  --card:#10151e;
  --card2:#151c27;
  --line:#263142;
  --text:#f5f7fb;
  --muted:#99a6b8;
  --blue:#6d9cff;
  --green:#25d878;
  --red:#ff5364;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 50% -10%,
      #1b2945 0,
      #080b11 42%,
      #05070b 100%
    );
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Arial,
    sans-serif;
}

/* =========================
   3 СЕКУНДТЫҚ INTRO
========================= */

#intro{
  position:fixed;
  inset:0;
  z-index:9999;
  background:#05070b;
  display:flex;
  align-items:center;
  justify-content:center;

  animation:
    introOut .65s ease 2.35s forwards;
}

.introBox{
  text-align:center;

  animation:
    introIn 1s cubic-bezier(.2,.8,.2,1);
}

.logo{
  width:76px;
  height:76px;

  border-radius:24px;

  margin:auto;

  display:grid;
  place-items:center;

  font-size:38px;

  background:
    linear-gradient(
      145deg,
      #1d2c48,
      #101722
    );

  border:1px solid #34445f;

  box-shadow:
    0 20px 70px #000;
}

.introTitle{
  font-size:28px;
  font-weight:900;
  margin-top:18px;
}

.introSub{
  color:var(--muted);
  margin-top:7px;
  font-size:14px;
}

.introLine{
  width:180px;
  height:3px;

  background:#172131;

  border-radius:10px;

  margin:22px auto 0;

  overflow:hidden;
}

.introLine i{
  display:block;
  height:100%;
  width:0;

  background:var(--blue);

  animation:
    load 2.4s ease forwards;
}

@keyframes introIn{
  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.96);
  }

  to{
    opacity:1;
    transform:none;
  }
}

@keyframes introOut{
  to{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
}

@keyframes load{
  to{
    width:100%;
  }
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:50;

  background:
    rgba(6,8,13,.88);

  backdrop-filter:blur(18px);

  border-bottom:
    1px solid var(--line);

  padding:14px;
}

.headerInner{
  max-width:1050px;
  margin:auto;
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
}

.menuBtn{
  width:44px;
  height:44px;

  padding:0;

  border-radius:14px;

  background:var(--card2);

  border:1px solid var(--line);

  color:#fff;

  font-size:21px;
}

h1{
  font-size:20px;
  margin:0;
  font-weight:900;
}

.sub{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.stats{
  display:flex;
  gap:8px;
  margin-top:12px;

  overflow:auto;
}

.stat{
  white-space:nowrap;

  padding:8px 11px;

  border-radius:11px;

  background:var(--card);

  border:1px solid var(--line);

  font-size:12px;

  color:#cbd5e3;
}

/* =========================
   MAIN
========================= */

main{
  max-width:1050px;
  margin:auto;

  padding:
    18px
    14px
    70px;
}

.screenTitle{
  font-size:22px;
  font-weight:900;

  margin:
    4px 0
    14px;
}

/* =========================
   TOPIC MENU
========================= */

.topicGrid{
  display:grid;

  grid-template-columns:
    repeat(
      2,
      minmax(0,1fr)
    );

  gap:10px;
}

.topicBtn{
  position:relative;

  text-align:left;

  padding:15px;

  border-radius:17px;

  background:
    linear-gradient(
      145deg,
      #111925,
      #0c1119
    );

  border:1px solid var(--line);

  color:#fff;

  min-height:82px;

  box-shadow:
    0 10px 30px
    rgba(0,0,0,.15);

  transition:.2s;
}

.topicBtn:active{
  transform:scale(.98);
}

.topicNum{
  font-size:11px;

  color:#88a9df;

  margin-bottom:6px;

  font-weight:800;
}

.topicName{
  font-size:14px;

  line-height:1.35;

  font-weight:750;
}

.topicCount{
  position:absolute;

  right:10px;
  bottom:10px;

  font-size:10px;

  color:var(--muted);
}

/* =========================
   BUTTON
========================= */

button{
  font:inherit;
  cursor:pointer;
}

.back{
  margin-bottom:12px;
}

.showAnswer{
  margin-top:10px;

  width:100%;

  background:#151e2a;

  color:#fff;

  border:
    1px solid var(--line);

  padding:11px;

  border-radius:12px;

  font-weight:750;
}

/* =========================
   QUESTION
========================= */

.qcard{
  background:
    linear-gradient(
      145deg,
      var(--card),
      #0c1118
    );

  border:
    1px solid var(--line);

  border-radius:19px;

  padding:15px;

  margin:10px 0;

  box-shadow:
    0 12px 35px
    rgba(0,0,0,.2);
}

.qhead{
  display:flex;
  gap:10px;
}

.num{
  min-width:34px;
  height:34px;

  border-radius:11px;

  background:#1c2940;

  color:#bcd3ff;

  display:grid;
  place-items:center;

  font-weight:900;
}

.qtext{
  font-size:15px;

  line-height:1.5;

  font-weight:700;
}

.options{
  display:grid;

  gap:8px;

  margin-top:13px;
}

.option{
  width:100%;

  text-align:left;

  padding:12px;

  border-radius:13px;

  border:
    1px solid var(--line);

  background:#090e15;

  color:#dfe7f2;

  line-height:1.4;

  transition:.2s;

  cursor:pointer;
}

.option b{
  color:#91b5ff;
  margin-right:7px;
}

/* ДҰРЫС ЖАУАП */

.option.correct{
  background:
    rgba(37,216,120,.14);

  border-color:
    var(--green);

  box-shadow:
    0 0 0 1px
    rgba(37,216,120,.18),

    0 0 22px
    rgba(37,216,120,.10);

  color:#d8ffe9;
}

.option.correct b{
  color:var(--green);
}

/* ҚАТЕ ЖАУАП */

.option.wrong{
  border-color:#7b3b48;

  background:
    rgba(255,70,90,.08);
}

/* =========================
   ANSWER INFO
========================= */

.answerInfo{
  display:none;

  margin-top:10px;

  padding:11px 12px;

  border-radius:12px;

  font-size:13px;
}

.answerInfo.show{
  display:block;
}

.answerInfo.ok{
  background:
    rgba(37,216,120,.09);

  border:
    1px solid
    rgba(37,216,120,.3);

  color:#bff5d4;
}

.answerInfo.missing{
  background:
    rgba(255,180,70,.08);

  border:
    1px solid
    rgba(255,180,70,.25);

  color:#ffd99c;
}

/* =========================
   SIDE MENU
========================= */

.drawer{
  position:fixed;

  inset:0;

  z-index:100;

  pointer-events:none;
}

.drawerBg{
  position:absolute;

  inset:0;

  background:
    rgba(0,0,0,.58);

  opacity:0;

  transition:.25s;
}

.drawerPanel{
  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:min(360px,88vw);

  background:#090d14;

  border-right:
    1px solid var(--line);

  transform:
    translateX(-100%);

  transition:.28s;

  padding:18px;

  overflow:auto;
}

.drawer.open{
  pointer-events:auto;
}

.drawer.open .drawerBg{
  opacity:1;
}

.drawer.open .drawerPanel{
  transform:none;
}

.drawerTitle{
  font-size:19px;
  font-weight:900;

  margin-bottom:12px;
}

.menuItem{
  width:100%;

  text-align:left;

  background:#101722;

  color:#e9eef7;

  border:
    1px solid var(--line);

  border-radius:13px;

  padding:12px;

  margin:5px 0;
}

.empty{
  text-align:center;

  padding:50px 15px;

  color:var(--muted);
}

@media(max-width:600px){

  .topicGrid{
    grid-template-columns:1fr;
  }

  .qcard{
    padding:13px;
  }

  h1{
    font-size:18px;
  }

}
</style>
</head>

<body>

<!-- =========================
     3 СЕКУНДТЫҚ ЗАСТАВКА
========================= -->

<div id="intro">

  <div class="introBox">

    <div class="logo">
      📚
    </div>

    <div class="introTitle">
      Тақырыптық тест
    </div>

    <div class="introSub">
      11 сынып • Дүниежүзі тарихы
    </div>

    <div class="introLine">
      <i></i>
    </div>

  </div>

</div>

<!-- =========================
     HEADER
========================= -->

<header>

  <div class="headerInner">

    <div class="top">

      <button
        class="menuBtn"
        onclick="openMenu()"
      >
        ☰
      </button>

      <div>

        <h1>
          📚 Тақырыптық тест
        </h1>

        <div class="sub">
          Барлық тақырыптар бір менюде
        </div>

      </div>

    </div>

    <div class="stats">

      <div
        class="stat"
        id="topicStat"
      >
        📖 0 тақырып
      </div>

      <div
        class="stat"
        id="questionStat"
      >
        📝 0 сұрақ
      </div>

      <div class="stat">
        ✨ Жауапты көрсету
      </div>

    </div>

  </div>

</header>

<!-- =========================
     MENU
========================= -->

<div
  class="drawer"
  id="drawer"
>

  <div
    class="drawerBg"
    onclick="closeMenu()"
  ></div>

  <div class="drawerPanel">

    <div class="drawerTitle">
      📚 Барлық тесттер
    </div>

    <button
      class="menuItem"
      onclick="showHome();closeMenu()"
    >
      🏠 Барлық тақырыптар
    </button>

    <div id="menuList"></div>

  </div>

</div>

<main id="app"></main>

<script>

/*
===========================================================
 DATA
===========================================================

Мұнда сенің DOCX файлыңдағы барлық 350 сұрақ орналасады.

Төмендегі формат:

{
  title:"Тақырып атауы",
  questions:[
    {
      n:1,
      text:"Сұрақ мәтіні",
      options:[
        "A жауап",
        "B жауап",
        "C жауап",
        "D жауап"
      ]
    }
  ]
}

===========================================================
*/

const DATA = [
{
title:"§1. Экономика және экономикалық жүйелердің типтері",

questions:[
{
n:1,
text:"Экономикада «көрінбейтін қол» деп атанған бос нарық тетігін ашты:",
options:[
"Д. Рикардо",
"В. Ленин",
"А. Смит",
"А. Маршалл"
]
},

{
n:2,
text:"Аристотель еңбектерінде «хремантистика» ұғымы нені білдіреді?",
options:[
"Байлықты жинақтау және ақша табу",
"Мемлекеттік басқару",
"Әскери дайындық",
"Жерді бөлу"
]
},

{
n:3,
text:"Еңбек бөлінісі мен қожайын және бағынышты адамдар арасындағы қатынастар көрсетілген ежелгі үнді дереккөзі:",
options:[
"Ведалар",
"Ману заңдары",
"Құран",
"Гильгамеш дастаны"
]
},

{
n:4,
text:"КСРО-дағы ЖЭС кезеңінде қалыптасқан экономикалық жүйе:",
options:[
"Дәстүрлі экономика",
"Нарықтық экономика",
"Әкімшілік экономика",
"Аралас экономика"
]
},

{
n:5,
text:"К. Маркс бойынша қосымша құнды кім иемденеді?",
options:[
"Капиталистер",
"Жұмысшылар",
"Мемлекет",
"Тұтынушылар"
]
},

{
n:6,
text:"А. Смит пен Д. Рикардоның теорияларын қосымша құн теориясымен дамытқан:",
options:[
"К. Маркс",
"Дж. Кейнс",
"А. Маршалл",
"М. Фридман"
]
},

{
n:7,
text:"Саудаға және ақша айналымына ерекше мән берген алғашқы экономикалық бағыт:",
options:[
"Физиократия",
"Меркантилизм",
"Классикалық мектеп",
"Кейнсиандық"
]
},

{
n:8,
text:"Жоспарлы социалистік экономикаға тән белгі:",
options:[
"Жеке меншік үстемдігі",
"Еркін баға",
"Мемлекеттік меншік",
"Толық бәсекелестік"
]
},

{
n:9,
text:"Кез келген экономикалық жүйе «не өндіру? қалай өндіру? кім үшін өндіру?» деген сұрақтарға жауап береді деген американдық экономист:",
options:[
"Пол Самуэльсон",
"Джон Кейнс",
"Милтон Фридман",
"Дэвид Рикардо"
]
},

{
n:10,
text:"«Халықтар байлығының табиғаты мен себептері туралы зерттеу» еңбегінің авторы:",
options:[
"Адам Смит",
"Карл Маркс",
"Джон Кейнс",
"Альфред Маршалл"
]
}

]
}

];

/*
===========================================================
ДҰРЫС ЖАУАПТАР
===========================================================

Формат:

ANSWERS["0-1"]="C";

Бірінші сан = тақырып индексі.
Екінші сан = сұрақ нөмірі.

Қазір бастапқы DOCX-та бөлек жауап кілті болмағандықтан,
ойдан жауап қоспау үшін бос қалдырылды.

===========================================================
*/

const ANSWERS = {};

const app =
document.getElementById("app");

const drawer =
document.getElementById("drawer");

document.getElementById("topicStat")
.textContent =
"📖 "+DATA.length+" тақырып";

document.getElementById("questionStat")
.textContent =
"📝 "+
DATA.reduce(
  (a,s)=>a+s.questions.length,
  0
)+
" сұрақ";


function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

}


function openMenu(){

  drawer.classList.add("open");

}


function closeMenu(){

  drawer.classList.remove("open");

}


function buildMenu(){

  const menu =
  document.getElementById("menuList");

  menu.innerHTML =
  DATA.map(
    (s,i)=>`

      <button
        class="menuItem"
        onclick="showTopic(${i});closeMenu()"
      >

        ${esc(s.title)}

        <span
          style="
            float:right;
            color:#8190a5
          "
        >
          ${s.questions.length}
        </span>

      </button>

    `
  ).join("");

}


function showHome(){

  app.innerHTML=`

    <div class="screenTitle">
      Барлық тесттер
    </div>

    <div class="topicGrid">

      ${
        DATA.map(
          (s,i)=>`

            <button
              class="topicBtn"
              onclick="showTopic(${i})"
            >

              <div class="topicNum">
                ТАҚЫРЫП ${i+1}
              </div>

              <div class="topicName">
                ${esc(s.title)}
              </div>

              <div class="topicCount">
                ${s.questions.length}
                сұрақ →
              </div>

            </button>

          `
        ).join("")
      }

    </div>

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function showTopic(si){

  const s =
  DATA[si];

  app.innerHTML=`

    <button
      class="showAnswer back"
      onclick="showHome()"
    >
      ← Барлық тесттерге қайту
    </button>

    <div class="screenTitle">
      ${esc(s.title)}
    </div>

    <div
      style="
        color:var(--muted);
        font-size:13px;
        margin-bottom:12px
      "
    >
      ${s.questions.length}
      сұрақ
    </div>

    ${
      s.questions
      .map(
        q=>renderQuestion(si,q)
      )
      .join("")
    }

  `;

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


function renderQuestion(si,q){

  const key =
  si+"-"+q.n;

  const answer =
  ANSWERS[key];

  const letters =
  q.options.map(
    (o,i)=>
      String.fromCharCode(
        65+i
      )
  );

  return `

    <article
      class="qcard"
      data-key="${key}"
    >

      <div class="qhead">

        <div class="num">
          ${q.n}
        </div>

        <div class="qtext">
          ${esc(q.text)}
        </div>

      </div>


      <div class="options">

        ${
          q.options.map(
            (o,i)=>`

              <button
                class="option"
                data-letter="${letters[i]}"
                onclick="choose(this,'${key}')"
              >

                <b>
                  ${letters[i]})
                </b>

                ${esc(o)}

              </button>

            `
          ).join("")
        }

      </div>


      <button
        class="showAnswer"
        onclick="reveal(this,'${key}')"
      >
        👁 Дұрыс жауапты көрсету
      </button>


      <div
        class="
          answerInfo
          ${answer ? "ok" : "missing"}
        "
        id="ans-${key}"
      >

        ${
          answer

          ?

          "✅ Дұрыс жауап: <b>"+
          esc(answer)+
          "</b> — дұрыс нұсқа жасыл түспен белгіленді."

          :

          "ℹ️ Бұл сұрақтың бастапқы DOCX файлында жеке дұрыс жауап кілті көрсетілмеген."
        }

      </div>

    </article>

  `;

}


function choose(btn,key){

  const card =
  btn.closest(".qcard");

  const correct =
  ANSWERS[key];

  card
  .querySelectorAll(".option")
  .forEach(
    x=>x.classList.remove(
      "wrong"
    )
  );


  if(!correct){

    btn.classList.add(
      "wrong"
    );

    const box =
    card.querySelector(
      ".answerInfo"
    );

    box.className =
    "answerInfo missing show";

    box.textContent =
    "ℹ️ Жауап кілті жоқ: бастапқы файлда бұл сұрақтың дұрыс нұсқасы белгіленбеген.";

    return;

  }


  if(
    btn.dataset.letter ===
    correct
  ){

    btn.classList.add(
      "correct"
    );

  }

  else{

    btn.classList.add(
      "wrong"
    );

  }


  card
  .querySelectorAll(".option")
  .forEach(
    x=>{

      if(
        x.dataset.letter ===
        correct
      ){

        x.classList.add(
          "correct"
        );

      }

    }
  );

}


function reveal(btn,key){

  const card =
  btn.closest(".qcard");

  const correct =
  ANSWERS[key];

  const box =
  card.querySelector(
    ".answerInfo"
  );

  box.classList.add(
    "show"
  );


  if(correct){

    card
    .querySelectorAll(".option")
    .forEach(
      x=>{

        x.classList.toggle(
          "correct",
          x.dataset.letter ===
          correct
        );

      }
    );

    btn.textContent =
    "🙈 Жауапты жасыру";

    btn.onclick =
    ()=>hideReveal(
      btn,
      key
    );

  }

}


function hideReveal(btn,key){

  const card =
  btn.closest(".qcard");

  card
  .querySelectorAll(".option")
  .forEach(
    x=>x.classList.remove(
      "correct"
    )
  );

  card
  .querySelector(
    ".answerInfo"
  )
  .classList.remove(
    "show"
  );

  btn.textContent =
  "👁 Дұрыс жауапты көрсету";

  btn.onclick =
  ()=>reveal(
    btn,
    key
  );

}


buildMenu();

showHome();

</script>
