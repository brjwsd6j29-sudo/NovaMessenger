<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RombGame — Крэш</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ===== EMBEDDED style.css ===== */
:root{
  --bg: #100E27;
  --surface: #1B1938;
  --surface-2: #242150;
  --border: #322D63;
  --text: #F1EFFF;
  --text-muted: #8B87B8;
  --violet: #7C5CFF;
  --violet-soft: #4B3FA0;
  --gold: #F5C94B;
  --crash: #FF4D6D;
  --cyan: #38E1C6;
  --radius: 18px;
  --font-display: 'Chakra Petch', sans-serif;
  --font-body: 'Inter', sans-serif;
}

*{box-sizing:border-box;}
html,body{
  margin:0; padding:0; height:100%;
  background: radial-gradient(120% 120% at 50% -10%, #211d4a 0%, var(--bg) 55%);
  color: var(--text);
  font-family: var(--font-body);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

button{font-family:inherit; cursor:pointer;}
input{font-family:inherit;}

/* ===================== ОБЩЕЕ ===================== */

.screen{min-height:100vh; width:100%;}

.brand{display:flex; align-items:center; gap:10px;}
.brand-gem{width:28px; height:28px; flex-shrink:0;}
.brand-name{font-family:var(--font-display); font-weight:600; font-size:1.05rem; letter-spacing:0.02em;}
.brand-sm .brand-gem{width:24px; height:24px;}

.btn{
  border:none; border-radius:12px; padding:13px 20px;
  font-weight:600; font-size:0.95rem; font-family:var(--font-body);
  transition: transform .12s ease, opacity .12s ease, background .2s ease;
}
.btn:active{transform: scale(0.97);}
.btn-block{width:100%;}
.btn-primary{
  background: linear-gradient(135deg, #9B7CFF, #6B4CE0);
  color:#fff;
  box-shadow: 0 8px 24px -8px rgba(124,92,255,0.6);
}
.btn-primary:hover{opacity:0.92;}
.btn-ghost{
  background: transparent; color: var(--text-muted); border:1px solid var(--border);
}
.btn-ghost:hover{color:var(--text); border-color: var(--violet-soft);}
.btn:disabled{opacity:0.45; cursor:not-allowed; transform:none;}

/* ===================== ЭКРАН ВХОДА ===================== */

.login-screen{
  display:flex; align-items:center; justify-content:center;
  padding: 24px;
}
.login-card{
  width:100%; max-width: 380px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 32px 28px;
  text-align:center;
}
.login-card .brand{justify-content:center; margin-bottom: 28px;}
.login-card h1{
  font-family: var(--font-display);
  font-size: 1.4rem; margin: 0 0 8px;
}
.login-hint{
  color: var(--text-muted); font-size: 0.88rem; line-height:1.5;
  margin: 0 0 24px;
}
.pincode-input{
  width:100%; text-align:center;
  font-family: var(--font-display); font-size:1.6rem; letter-spacing: 0.35em;
  background: var(--surface-2); border:1px solid var(--border); border-radius:12px;
  color: var(--text); padding: 14px 10px 14px 18px;
  margin-bottom: 16px;
  outline:none;
}
.pincode-input:focus{border-color: var(--violet);}
.login-error{
  color: var(--crash); font-size:0.85rem; margin-top:14px;
}

/* ===================== TOPBAR ===================== */

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding: 16px 20px;
  position:relative;
  border-bottom: 1px solid var(--border);
}
.profile-chip{
  display:flex; align-items:center; gap:10px;
  background: var(--surface); border:1px solid var(--border); border-radius:999px;
  padding: 7px 14px 7px 8px;
  color: var(--text);
}
.profile-balance{
  display:flex; align-items:center; gap:5px;
  background: var(--surface-2); border-radius:999px; padding:5px 10px;
  font-family: var(--font-display); font-weight:600; font-size:0.92rem; color:var(--gold);
}
.profile-name{font-size:0.85rem; color:var(--text-muted); max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chevron{color:var(--text-muted);}

.profile-dropdown{
  position:absolute; top:64px; right:20px; z-index:20;
  background: var(--surface); border:1px solid var(--border); border-radius:14px;
  padding: 14px; width:200px;
  box-shadow: 0 16px 40px -12px rgba(0,0,0,0.6);
}
.pd-row{display:flex; justify-content:space-between; font-size:0.85rem; padding:6px 2px; color:var(--text-muted);}
.pd-row b{color:var(--text); font-family:var(--font-display);}
#logoutBtn{margin-top:10px; padding:9px;}

/* ===================== ГЛАВНОЕ МЕНЮ ===================== */

.menu-view{
  max-width: 480px; margin: 0 auto; padding: 32px 20px;
}
.menu-title{
  font-family: var(--font-display); font-size:1.2rem; font-weight:600;
  margin: 0 0 18px; color: var(--text-muted);
}
.game-card{
  width:100%; display:flex; align-items:center; gap:16px;
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding: 18px; margin-bottom: 12px; text-align:left; color:inherit;
  transition: border-color .15s ease, transform .12s ease;
}
.game-card:not(.game-card-soon):hover{border-color: var(--violet-soft); transform: translateY(-2px);}
.game-card-soon{opacity:0.5; cursor:default;}
.game-card-icon{font-size:1.8rem; width:48px; text-align:center;}
.game-card-body{flex:1;}
.game-card-name{font-family:var(--font-display); font-weight:600; font-size:1.05rem;}
.game-card-desc{font-size:0.82rem; color:var(--text-muted); margin-top:2px;}
.game-card-arrow{color:var(--violet); font-size:1.2rem;}

/* ===================== ИГРА КРЭШ ===================== */

.crash-view{
  max-width: 480px; margin:0 auto; padding: 16px 16px 24px;
  display:flex; flex-direction:column; gap:14px;
}
.back-btn{
  align-self:flex-start; background:none; border:none; color:var(--text-muted);
  font-size:0.88rem; padding:4px 0;
}
.back-btn:hover{color:var(--text);}

.history-strip{
  display:flex; gap:8px; overflow-x:auto; padding-bottom:2px;
}
.history-chip{
  flex-shrink:0; font-family:var(--font-display); font-weight:600; font-size:0.8rem;
  padding:6px 11px; border-radius:999px; background: var(--surface); border:1px solid var(--border);
}
.hc-low{color: var(--text-muted);}
.hc-mid{color: var(--gold); border-color: rgba(245,201,75,0.35);}
.hc-high{color: var(--violet); border-color: rgba(124,92,255,0.5); box-shadow: 0 0 14px -4px rgba(124,92,255,0.6);}

.stage{
  position:relative; height: 300px;
  background: linear-gradient(180deg, #191650 0%, #100E27 100%);
  border:1px solid var(--border); border-radius: var(--radius);
  overflow:hidden;
}
#rocketCanvas{position:absolute; inset:0; width:100%; height:100%;}
.stage-overlay{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; pointer-events:none;
}
.phase-label{
  font-size:0.82rem; color: var(--text-muted); letter-spacing:0.02em; margin-bottom:6px;
}
.multiplier-value{
  font-family: var(--font-display); font-weight:700; font-size:3.2rem;
  color: var(--text); text-shadow: 0 0 30px rgba(124,92,255,0.35);
  transition: color .2s ease;
}
.multiplier-value.mv-running{color: var(--violet);}
.multiplier-value.mv-crashed{color: var(--crash); text-shadow: 0 0 30px rgba(255,77,109,0.5);}
.countdown-value{
  font-family: var(--font-display); font-size:1.6rem; color: var(--gold); margin-top:6px;
}

.bet-panel{
  background: var(--surface); border:1px solid var(--border); border-radius: var(--radius);
  padding: 18px; display:flex; flex-direction:column; gap:14px;
}
.bet-row{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
.bet-label{font-size:0.85rem; color:var(--text-muted); display:flex; align-items:center; gap:8px;}
.bet-input-group{display:flex; align-items:center; gap:6px; flex:1; justify-content:flex-end;}
.bet-input{
  width:100px; background: var(--surface-2); border:1px solid var(--border); border-radius:10px;
  color:var(--text); font-family:var(--font-display); font-weight:600; padding:9px 10px; text-align:right;
  outline:none;
}
.bet-input:focus{border-color:var(--violet);}
.bet-input:disabled{opacity:0.4;}
.qbtn{
  background: var(--surface-2); border:1px solid var(--border); color:var(--text-muted);
  border-radius:8px; padding:8px 10px; font-size:0.78rem; font-weight:600;
}
.qbtn:hover{color:var(--text); border-color:var(--violet-soft);}

.switch{position:relative; display:inline-block; width:34px; height:19px;}
.switch input{opacity:0; width:0; height:0;}
.switch-track{
  position:absolute; inset:0; background: var(--surface-2); border:1px solid var(--border);
  border-radius:999px; transition: background .2s ease;
}
.switch-track::before{
  content:""; position:absolute; width:13px; height:13px; left:2px; top:2px;
  background: var(--text-muted); border-radius:50%; transition: transform .2s ease, background .2s ease;
}
.switch input:checked + .switch-track{background: var(--violet-soft); border-color:var(--violet);}
.switch input:checked + .switch-track::before{transform: translateX(15px); background:#fff;}

.btn-action{
  background: linear-gradient(135deg, #9B7CFF, #6B4CE0); color:#fff;
  font-size:1rem; padding:15px;
}
.btn-action.state-cashout{background: linear-gradient(135deg, #FFD873, #F5C94B); color:#2a2005;}
.btn-action.state-locked{background: var(--surface-2); color: var(--text-muted);}

.bet-error{color:var(--crash); font-size:0.82rem; text-align:center; margin:0;}

/* ===================== ТОСТ ВЫИГРЫША ===================== */

.win-toast{
  position:fixed; top:22px; left:50%; transform: translateX(-50%) translateY(-16px);
  display:flex; align-items:center; gap:12px;
  background: linear-gradient(135deg, #201c4a, #171341);
  border:1px solid rgba(245,201,75,0.5);
  border-radius:16px; padding:14px 20px; z-index:100;
  box-shadow: 0 20px 50px -14px rgba(0,0,0,0.7);
  opacity:0; transition: opacity .25s ease, transform .25s ease;
}
.win-toast.show{opacity:1; transform: translateX(-50%) translateY(0);}
.win-toast-icon{font-size:1.6rem;}
.win-toast-title{font-family:var(--font-display); font-weight:700; color:var(--gold);}
.win-toast-sub{font-size:0.85rem; color:var(--text-muted); margin-top:2px;}
.win-toast-glow{
  position:absolute; inset:-2px; border-radius:18px; z-index:-1;
  background: radial-gradient(circle, rgba(245,201,75,0.35), transparent 70%);
  filter: blur(10px);
}

#confettiCanvas{
  position:fixed; inset:0; pointer-events:none; z-index:99;
}

/* ===================== БАЛАНС АНИМАЦИЯ ===================== */

.balance-pulse{animation: pulseGreen 0.7s ease;}
@keyframes pulseGreen{
  0%{color: var(--gold);}
  30%{color: #6BFFA0; transform: scale(1.12);}
  100%{color: var(--gold); transform: scale(1);}
}
.profile-balance span{display:inline-block;}

@media (max-width: 480px){
  .multiplier-value{font-size:2.6rem;}
  .stage{height:260px;}
}

</style>
</head>
<body>

<!-- ===================== ЭКРАН ВХОДА ===================== -->
<div id="loginScreen" class="screen login-screen">
  <div class="login-card">
    <div class="brand">
      <svg class="brand-gem" viewBox="0 0 40 40" fill="none">
        <path d="M20 2 L36 14 L20 38 L4 14 Z" fill="url(#gemGrad)"/>
        <path d="M20 2 L36 14 L20 20 Z" fill="#fff" opacity="0.18"/>
        <path d="M4 14 L20 20 L20 2 Z" fill="#fff" opacity="0.08"/>
        <defs>
          <linearGradient id="gemGrad" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
            <stop stop-color="#9B7CFF"/>
            <stop offset="1" stop-color="#5B3FE0"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="brand-name">RombGame</span>
    </div>

    <h1>Вход в аккаунт</h1>
    <p class="login-hint">Напишите боту <b>/mypincode</b> в личные сообщения — он пришлёт код входа.</p>

    <form id="loginForm" autocomplete="off">
      <input
        id="pincodeInput"
        class="pincode-input"
        inputmode="numeric"
        maxlength="6"
        placeholder="• • • • • •"
        autocomplete="off"
      >
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <p id="loginError" class="login-error" hidden></p>
  </div>
</div>

<!-- ===================== ПРИЛОЖЕНИЕ ===================== -->
<div id="app" class="screen app-screen" hidden>

  <header class="topbar">
    <div class="brand brand-sm">
      <svg class="brand-gem" viewBox="0 0 40 40" fill="none">
        <path d="M20 2 L36 14 L20 38 L4 14 Z" fill="url(#gemGrad2)"/>
        <path d="M20 2 L36 14 L20 20 Z" fill="#fff" opacity="0.18"/>
        <path d="M4 14 L20 20 L20 2 Z" fill="#fff" opacity="0.08"/>
        <defs>
          <linearGradient id="gemGrad2" x1="4" y1="2" x2="36" y2="38" gradientUnits="userSpaceOnUse">
            <stop stop-color="#9B7CFF"/>
            <stop offset="1" stop-color="#5B3FE0"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="brand-name">RombGame</span>
    </div>

    <button id="profileChip" class="profile-chip">
      <span class="profile-balance">
        <svg width="14" height="14" viewBox="0 0 40 40"><path d="M20 2 L36 14 L20 38 L4 14 Z" fill="#F5C94B"/></svg>
        <span id="balanceValue">0</span>
      </span>
      <span class="profile-name" id="nicknameValue">Игрок</span>
      <svg class="chevron" width="10" height="10" viewBox="0 0 10 10"><path d="M1 3 L5 7 L9 3" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
    </button>

    <div id="profileDropdown" class="profile-dropdown" hidden>
      <div class="pd-row"><span>Баланс</span><b id="pdBalance">0</b></div>
      <div class="pd-row"><span>Банк</span><b id="pdBank">0</b></div>
      <div class="pd-row"><span>Уровень</span><b id="pdLvl">1</b></div>
      <button id="logoutBtn" class="btn btn-ghost btn-block">Выйти</button>
    </div>
  </header>

  <!-- ---------- ГЛАВНОЕ МЕНЮ ---------- -->
  <main id="menuView" class="menu-view">
    <h2 class="menu-title">Выберите игру</h2>
    <button id="openCrashBtn" class="game-card">
      <div class="game-card-icon">🚀</div>
      <div class="game-card-body">
        <div class="game-card-name">Крэш</div>
        <div class="game-card-desc">Забери выигрыш до того, как ракета улетит</div>
      </div>
      <div class="game-card-arrow">→</div>
    </button>
    <div class="game-card game-card-soon">
      <div class="game-card-icon">✨</div>
      <div class="game-card-body">
        <div class="game-card-name">Скоро новые игры</div>
        <div class="game-card-desc">Следите за обновлениями в боте</div>
      </div>
    </div>
  </main>

  <!-- ---------- ИГРА КРЭШ ---------- -->
  <main id="crashView" class="crash-view" hidden>
    <button id="backToMenuBtn" class="back-btn">← Меню</button>

    <div class="history-strip" id="historyStrip"></div>

    <div class="stage">
      <canvas id="rocketCanvas"></canvas>
      <div class="stage-overlay">
        <div id="phaseLabel" class="phase-label">Ставки принимаются</div>
        <div id="multiplierValue" class="multiplier-value">1.00x</div>
        <div id="countdownValue" class="countdown-value"></div>
      </div>
    </div>

    <div class="bet-panel">
      <div class="bet-row">
        <label class="bet-label">Ставка</label>
        <div class="bet-input-group">
          <button class="qbtn" data-op="half">½</button>
          <input id="betAmountInput" type="number" min="100" step="100" value="100" class="bet-input">
          <button class="qbtn" data-op="double">2×</button>
          <button class="qbtn" data-op="max">MAX</button>
        </div>
      </div>

      <div class="bet-row">
        <label class="bet-label">
          <span class="switch">
            <input type="checkbox" id="autoCashoutToggle">
            <span class="switch-track"></span>
          </span>
          Автозабор
        </label>
        <input id="autoCashoutInput" type="number" min="1.01" step="0.01" value="2.00" class="bet-input" disabled>
      </div>

      <button id="actionBtn" class="btn btn-action" disabled>Дождитесь раунда</button>
      <p id="betError" class="bet-error" hidden></p>
    </div>
  </main>
</div>

<!-- ---------- ТОСТ УСПЕШНОГО ЗАБОРА ---------- -->
<div id="winToast" class="win-toast" hidden>
  <div class="win-toast-glow"></div>
  <div class="win-toast-icon">💎</div>
  <div class="win-toast-text">
    <div class="win-toast-title">Успешно забрали!</div>
    <div class="win-toast-sub"><span id="winMult">1.00x</span> · +<span id="winAmount">0</span> ромб</div>
  </div>
</div>

<canvas id="confettiCanvas"></canvas>


<script>
/* ===== EMBEDDED app.js ===== */
(() => {
  "use strict";

  // =====================================================
  // GITHUB PAGES / REMOTE BACKEND
  // =====================================================
  // Replace this with the public HTTPS URL of your backend.
  // Example: https://xxxxx.trycloudflare.com
  const API_BASE_URL = "https://follows-spanking-chicken-shadows.trycloudflare.com";

  function apiUrl(path) {
    return API_BASE_URL.replace(/\/$/, "") + path;
  }

  function apiHeaders(extra = {}) {
    const headers = { ...extra };
    const token = localStorage.getItem("romb_session_token");
    if (token) headers["Authorization"] = `Bearer ${token}`;
    return headers;
  }

  // ===================== ЭЛЕМЕНТЫ =====================
  const loginScreen = document.getElementById("loginScreen");
  const appScreen = document.getElementById("app");
  const loginForm = document.getElementById("loginForm");
  const pincodeInput = document.getElementById("pincodeInput");
  const loginError = document.getElementById("loginError");

  const profileChip = document.getElementById("profileChip");
  const profileDropdown = document.getElementById("profileDropdown");
  const balanceValue = document.getElementById("balanceValue");
  const nicknameValue = document.getElementById("nicknameValue");
  const pdBalance = document.getElementById("pdBalance");
  const pdBank = document.getElementById("pdBank");
  const pdLvl = document.getElementById("pdLvl");
  const logoutBtn = document.getElementById("logoutBtn");

  const menuView = document.getElementById("menuView");
  const crashView = document.getElementById("crashView");
  const openCrashBtn = document.getElementById("openCrashBtn");
  const backToMenuBtn = document.getElementById("backToMenuBtn");

  const historyStrip = document.getElementById("historyStrip");
  const phaseLabel = document.getElementById("phaseLabel");
  const multiplierValue = document.getElementById("multiplierValue");
  const countdownValue = document.getElementById("countdownValue");
  const rocketCanvas = document.getElementById("rocketCanvas");
  const rctx = rocketCanvas.getContext("2d");

  const betAmountInput = document.getElementById("betAmountInput");
  const autoCashoutToggle = document.getElementById("autoCashoutToggle");
  const autoCashoutInput = document.getElementById("autoCashoutInput");
  const actionBtn = document.getElementById("actionBtn");
  const betError = document.getElementById("betError");

  const winToast = document.getElementById("winToast");
  const winMult = document.getElementById("winMult");
  const winAmount = document.getElementById("winAmount");
  const confettiCanvas = document.getElementById("confettiCanvas");
  const cctx = confettiCanvas.getContext("2d");

  // ===================== СОСТОЯНИЕ =====================
  let profile = null;
  let ws = null;
  let currentState = null;
  let myBetPlaced = false;      // ставка сделана в текущем раунде
  let myBetActive = false;      // ставка ещё не забрана
  let lastSeenRoundId = null;
  let curvePoints = [];

  function fmt(n) {
    return Math.round(n).toLocaleString("ru-RU").replace(/,/g, " ");
  }

  // ===================== ЛОГИН =====================
  pincodeInput.addEventListener("input", () => {
    pincodeInput.value = pincodeInput.value.replace(/\D/g, "").slice(0, 6);
  });

  loginForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    loginError.hidden = true;
    const pincode = pincodeInput.value.trim();
    if (pincode.length !== 6) {
      loginError.textContent = "Введите 6-значный пинкод из бота";
      loginError.hidden = false;
      return;
    }
    try {
      const res = await fetch(apiUrl("/api/login"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pincode }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        throw new Error(data.detail || "Неверный пинкод");
      }
      const loginData = await res.clone().json().catch(() => null);
      if (loginData?.token) localStorage.setItem("romb_session_token", loginData.token);
      await bootApp();
    } catch (err) {
      loginError.textContent = err.message;
      loginError.hidden = false;
    }
  });

  logoutBtn.addEventListener("click", async () => {
    await fetch(apiUrl("/api/logout"), { method: "POST", headers: apiHeaders() });
    if (ws) ws.close();
    localStorage.removeItem("romb_session_token");
    location.reload();
  });

  profileChip.addEventListener("click", () => {
    profileDropdown.hidden = !profileDropdown.hidden;
  });
  document.addEventListener("click", (e) => {
    if (!profileChip.contains(e.target) && !profileDropdown.contains(e.target)) {
      profileDropdown.hidden = true;
    }
  });

  // ===================== ЗАГРУЗКА ПРОФИЛЯ =====================
  async function fetchProfile() {
    const res = await fetch(apiUrl("/api/profile"), { headers: apiHeaders() });
    if (!res.ok) throw new Error("unauth");
    profile = await res.json();
    renderProfile();
  }

  function renderProfile(animateBalance = false) {
    if (!profile) return;
    nicknameValue.textContent = profile.nickname;
    pdBank.textContent = fmt(profile.bank);
    pdLvl.textContent = profile.lvl;
    if (animateBalance) {
      balanceValue.parentElement.classList.remove("balance-pulse");
      void balanceValue.parentElement.offsetWidth; // restart animation
      balanceValue.parentElement.classList.add("balance-pulse");
    }
    balanceValue.textContent = fmt(profile.balance);
    pdBalance.textContent = fmt(profile.balance);
  }

  async function bootApp() {
    try {
      await fetchProfile();
    } catch {
      loginScreen.hidden = false;
      appScreen.hidden = true;
      return;
    }
    loginScreen.hidden = true;
    appScreen.hidden = false;
    connectWS();
  }

  // ===================== НАВИГАЦИЯ =====================
  openCrashBtn.addEventListener("click", () => {
    menuView.hidden = true;
    crashView.hidden = false;
    resizeCanvas();
  });
  backToMenuBtn.addEventListener("click", () => {
    crashView.hidden = true;
    menuView.hidden = false;
  });

  // ===================== СТАВКА: БЫСТРЫЕ КНОПКИ =====================
  document.querySelectorAll(".qbtn").forEach((btn) => {
    btn.addEventListener("click", () => {
      const cur = parseInt(betAmountInput.value || "0", 10);
      const bal = profile ? profile.balance : 0;
      if (btn.dataset.op === "half") betAmountInput.value = Math.max(100, Math.floor(cur / 2));
      if (btn.dataset.op === "double") betAmountInput.value = Math.min(bal, cur * 2 || 100);
      if (btn.dataset.op === "max") betAmountInput.value = bal;
    });
  });

  autoCashoutToggle.addEventListener("change", () => {
    autoCashoutInput.disabled = !autoCashoutToggle.checked;
  });

  // ===================== WEBSOCKET =====================
  function connectWS() {
    const wsBase = API_BASE_URL.replace(/^http:/, "ws:").replace(/^https:/, "wss:").replace(/\/$/, "");
    ws = new WebSocket(`${wsBase}/ws/crash`);
    ws.onmessage = (evt) => {
      const state = JSON.parse(evt.data);
      handleState(state);
    };
    ws.onclose = () => {
      setTimeout(() => { if (!appScreen.hidden) connectWS(); }, 1500);
    };
  }

  function handleState(state) {
    const prevPhase = currentState ? currentState.phase : null;
    currentState = state;

    if (state.round_id !== lastSeenRoundId) {
      lastSeenRoundId = state.round_id;
      myBetPlaced = false;
      myBetActive = false;
      curvePoints = [];
      betError.hidden = true;
    }

    renderHistory(state.history);
    renderPhase(state, prevPhase);
    drawRocket(state);
  }

  function renderHistory(history) {
    historyStrip.innerHTML = "";
    history.forEach((val) => {
      const chip = document.createElement("div");
      let cls = "hc-low";
      if (val >= 10) cls = "hc-high";
      else if (val >= 2) cls = "hc-mid";
      chip.className = `history-chip ${cls}`;
      chip.textContent = `${val.toFixed(2)}x`;
      historyStrip.appendChild(chip);
    });
  }

  function renderPhase(state, prevPhase) {
    multiplierValue.classList.remove("mv-running", "mv-crashed");

    if (state.phase === "waiting") {
      phaseLabel.textContent = "Ставки принимаются";
      multiplierValue.textContent = "1.00x";
      countdownValue.textContent = Math.max(0, Math.ceil(state.phase_ends_in));
      updateActionButton("waiting");
    } else if (state.phase === "running") {
      phaseLabel.textContent = "Полёт";
      multiplierValue.classList.add("mv-running");
      multiplierValue.textContent = `${state.multiplier.toFixed(2)}x`;
      countdownValue.textContent = "";
      updateActionButton("running", state.multiplier);
    } else if (state.phase === "crashed") {
      phaseLabel.textContent = "Крах!";
      multiplierValue.classList.add("mv-crashed");
      multiplierValue.textContent = `${state.crash_point.toFixed(2)}x`;
      countdownValue.textContent = "";
      updateActionButton("crashed");

      if (prevPhase === "running" && myBetActive) {
        myBetActive = false;
        showBetLostFeedback(state.crash_point);
      }
    }
  }

  function showBetLostFeedback(crashPoint) {
    betError.hidden = false;
    betError.textContent = `Крах на ${crashPoint.toFixed(2)}x — ставка сгорела`;
    fetchProfile();
  }

  function updateActionButton(phase, multiplier) {
    actionBtn.classList.remove("state-cashout", "state-locked");

    if (phase === "waiting") {
      if (myBetPlaced) {
        actionBtn.textContent = "Ставка принята ✓";
        actionBtn.classList.add("state-locked");
        actionBtn.disabled = true;
      } else {
        actionBtn.textContent = "Поставить";
        actionBtn.disabled = false;
      }
    } else if (phase === "running") {
      if (myBetActive) {
        const bet = parseInt(betAmountInput.value || "0", 10);
        const potential = Math.floor(bet * multiplier);
        actionBtn.textContent = `Забрать ${fmt(potential)}`;
        actionBtn.classList.add("state-cashout");
        actionBtn.disabled = false;
      } else {
        actionBtn.textContent = myBetPlaced ? "Уже забрано" : "Раунд уже идёт";
        actionBtn.classList.add("state-locked");
        actionBtn.disabled = true;
      }
    } else {
      actionBtn.textContent = "Дождитесь раунда";
      actionBtn.classList.add("state-locked");
      actionBtn.disabled = true;
    }
  }

  actionBtn.addEventListener("click", async () => {
    if (!currentState) return;
    betError.hidden = true;

    if (currentState.phase === "waiting" && !myBetPlaced) {
      const amount = parseInt(betAmountInput.value || "0", 10);
      const body = { amount };
      if (autoCashoutToggle.checked) {
        body.auto_cashout = parseFloat(autoCashoutInput.value || "0");
      }
      try {
        const res = await fetch(apiUrl("/api/crash/bet"), {
          method: "POST",
          headers: apiHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Ошибка ставки");
        profile.balance = data.balance;
        renderProfile();
        myBetPlaced = true;
        myBetActive = true;
        updateActionButton("waiting");
      } catch (err) {
        betError.textContent = err.message;
        betError.hidden = false;
      }
    } else if (currentState.phase === "running" && myBetActive) {
      try {
        const res = await fetch(apiUrl("/api/crash/cashout"), { method: "POST", headers: apiHeaders() });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || "Ошибка забора");
        myBetActive = false;
        profile.balance = data.balance;
        renderProfile(true);
        updateActionButton("running", currentState.multiplier);
        showWinToast(data.multiplier, data.win);
        launchConfetti();
      } catch (err) {
        betError.textContent = err.message;
        betError.hidden = false;
      }
    }
  });

  // ===================== ТОСТ ВЫИГРЫША =====================
  let toastTimer = null;
  function showWinToast(mult, amount) {
    winMult.textContent = `${mult.toFixed(2)}x`;
    winAmount.textContent = fmt(amount);
    winToast.hidden = false;
    requestAnimationFrame(() => winToast.classList.add("show"));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      winToast.classList.remove("show");
      setTimeout(() => { winToast.hidden = true; }, 250);
    }, 2600);
  }

  // ===================== КОНФЕТТИ =====================
  let confettiParticles = [];
  let confettiRAF = null;
  function resizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeConfetti);
  resizeConfetti();

  function launchConfetti() {
    const colors = ["#F5C94B", "#7C5CFF", "#38E1C6", "#FF9DB2"];
    for (let i = 0; i < 60; i++) {
      confettiParticles.push({
        x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 120,
        y: 90,
        vx: (Math.random() - 0.5) * 6,
        vy: Math.random() * -6 - 2,
        size: Math.random() * 5 + 3,
        color: colors[Math.floor(Math.random() * colors.length)],
        life: 0,
      });
    }
    if (!confettiRAF) confettiRAF = requestAnimationFrame(tickConfetti);
  }

  function tickConfetti() {
    cctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiParticles.forEach((p) => {
      p.vy += 0.18;
      p.x += p.vx;
      p.y += p.vy;
      p.life += 1;
      cctx.globalAlpha = Math.max(0, 1 - p.life / 90);
      cctx.fillStyle = p.color;
      cctx.fillRect(p.x, p.y, p.size, p.size);
    });
    confettiParticles = confettiParticles.filter((p) => p.life < 90);
    cctx.globalAlpha = 1;
    if (confettiParticles.length > 0) {
      confettiRAF = requestAnimationFrame(tickConfetti);
    } else {
      confettiRAF = null;
    }
  }

  // ===================== АНИМАЦИЯ РАКЕТЫ =====================
  function resizeCanvas() {
    const rect = rocketCanvas.parentElement.getBoundingClientRect();
    rocketCanvas.width = rect.width * devicePixelRatio;
    rocketCanvas.height = rect.height * devicePixelRatio;
    rocketCanvas.style.width = rect.width + "px";
    rocketCanvas.style.height = rect.height + "px";
    rctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  }
  window.addEventListener("resize", () => { if (!crashView.hidden) resizeCanvas(); });

  function drawRocket(state) {
    const w = rocketCanvas.clientWidth;
    const h = rocketCanvas.clientHeight;
    rctx.clearRect(0, 0, w, h);

    if (state.phase === "waiting") {
      curvePoints = [];
      return;
    }

    const mult = state.phase === "crashed" ? state.crash_point : state.multiplier;
    curvePoints.push(mult);
    if (curvePoints.length > 400) curvePoints.shift();

    const maxMult = Math.max(2, mult * 1.15);
    const padding = 24;
    const toXY = (i, m) => {
      const x = padding + (i / Math.max(1, curvePoints.length - 1)) * (w - padding * 2) * 0.85;
      const y = h - padding - (Math.min(m, maxMult) / maxMult) * (h - padding * 2);
      return [x, y];
    };

    // трасса
    rctx.beginPath();
    curvePoints.forEach((m, i) => {
      const [x, y] = toXY(i, m);
      if (i === 0) rctx.moveTo(x, y);
      else rctx.lineTo(x, y);
    });
    const grad = rctx.createLinearGradient(0, 0, w, 0);
    grad.addColorStop(0, "#38E1C6");
    grad.addColorStop(1, state.phase === "crashed" ? "#FF4D6D" : "#7C5CFF");
    rctx.strokeStyle = grad;
    rctx.lineWidth = 3;
    rctx.lineJoin = "round";
    rctx.stroke();

    // заливка под трассой
    if (curvePoints.length > 1) {
      const [lastX] = toXY(curvePoints.length - 1, curvePoints[curvePoints.length - 1]);
      rctx.lineTo(lastX, h - padding);
      rctx.lineTo(padding, h - padding);
      rctx.closePath();
      rctx.fillStyle = "rgba(124,92,255,0.08)";
      rctx.fill();
    }

    // ракета/точка на конце
    if (curvePoints.length > 0) {
      const [x, y] = toXY(curvePoints.length - 1, curvePoints[curvePoints.length - 1]);
      rctx.beginPath();
      rctx.arc(x, y, 6, 0, Math.PI * 2);
      rctx.fillStyle = state.phase === "crashed" ? "#FF4D6D" : "#F5C94B";
      rctx.shadowColor = state.phase === "crashed" ? "#FF4D6D" : "#F5C94B";
      rctx.shadowBlur = 16;
      rctx.fill();
      rctx.shadowBlur = 0;

      if (state.phase === "running") {
        rctx.font = "20px sans-serif";
        rctx.textAlign = "center";
        rctx.textBaseline = "middle";
        rctx.save();
        rctx.translate(x, y - 14);
        rctx.rotate(-0.5);
        rctx.fillText("🚀", 0, 0);
        rctx.restore();
      }
    }
  }

  // ===================== СТАРТ =====================
  bootApp();
})();

</script>
