<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0, user-scalable=no">

    <title>Nova Messenger</title>

    <!-- Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f1115;
            color: white;
            min-height: 100vh;
        }

        .app {
            max-width: 520px;
            min-height: 100vh;
            margin: auto;
            background: #151820;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        header {
            padding: 18px;
            background: #1c2029;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            font-size: 21px;
        }

        .online {
            color: #4ade80;
            font-size: 13px;
        }

        /* SEARCH */

        .search {
            padding: 12px;
            background: #1c2029;
        }

        .search input {
            width: 100%;
            padding: 12px 15px;

            border: none;
            outline: none;
            border-radius: 12px;

            background: #292e38;
            color: white;
            font-size: 15px;
        }

        /* CHATS */

        .chats {
            flex: 1;
            overflow-y: auto;
        }

        .chat {
            display: flex;
            align-items: center;
            gap: 12px;

            padding: 15px;

            cursor: pointer;

            border-bottom: 1px solid #242833;
        }

        .chat:active {
            background: #20242d;
        }

        .avatar {
            width: 50px;
            height: 50px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #5865f2;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }

        .chat-info h3 {
            font-size: 16px;
        }

        .chat-info p {
            margin-top: 5px;

            color: #9299a8;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* BOTTOM */

        .bottom {
            display: flex;
            justify-content: space-around;

            padding: 13px;

            background: #1c2029;

            border-top: 1px solid #292e38;
        }

        .bottom button {
            background: none;
            border: none;

            color: #9299a8;

            font-size: 14px;

            cursor: pointer;
        }

        .bottom button.active {
            color: white;
        }

        /* CHAT */

        .chat-screen {
            display: none;

            flex-direction: column;

            height: 100vh;
        }

        .chat-header {
            padding: 13px;

            background: #1c2029;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back {
            font-size: 27px;
            cursor: pointer;
        }

        .messages {
            flex: 1;

            padding: 15px;

            overflow-y: auto;
        }

        .message {
            max-width: 75%;

            padding: 10px 13px;

            margin-bottom: 10px;

            border-radius: 14px;

            background: #292e38;

            word-wrap: break-word;
        }

        .message.me {
            margin-left: auto;

            background: #5865f2;
        }

        .input-area {
            display: flex;

            gap: 8px;

            padding: 10px;

            background: #1c2029;
        }

        .input-area input {
            flex: 1;

            padding: 12px;

            border: none;
            outline: none;

            border-radius: 12px;

            background: #292e38;

            color: white;
        }

        .input-area button {
            width: 45px;

            border: none;
            border-radius: 12px;

            background: #5865f2;

            color: white;

            font-size: 18px;

            cursor: pointer;
        }

        /* PROFILE */

        .profile {
            display: none;

            flex: 1;

            padding: 35px 20px;

            text-align: center;
        }

        .profile-avatar {
            width: 95px;
            height: 95px;

            margin: auto;
            margin-bottom: 15px;

            border-radius: 50%;

            background: #5865f2;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
        }

        .profile h2 {
            margin-bottom: 5px;
        }

        .username {
            color: #9299a8;
        }

        .user-id {
            margin-top: 15px;

            padding: 12px;

            border-radius: 12px;

            background: #1c2029;

            color: #9299a8;

            font-size: 13px;
        }

        /* BALANCE */

        .balance {
            margin: 20px 0;

            padding: 18px;

            border-radius: 15px;

            background: #1c2029;
        }

        .balance-title {
            color: #9299a8;
            font-size: 13px;
        }

        .balance-value {
            margin-top: 7px;

            font-size: 27px;
            font-weight: bold;
        }

        /* CLOSE */

        .close-button {
            margin-top: 20px;

            padding: 12px 20px;

            border: none;
            border-radius: 12px;

            background: #5865f2;

            color: white;

            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HOME -->

    <div id="home">

        <header>
            <h1>Nova Messenger</h1>

            <span class="online">
                ● online
            </span>
        </header>

        <div class="search">

            <input
                id="search"
                type="text"
                placeholder="🔎 Поиск чатов..."
                oninput="searchChats()"
            >

        </div>

        <div class="chats">

            <div class="chat"
                 onclick="openChat('Alex')">

                <div class="avatar">
                    A
                </div>

                <div class="chat-info">

                    <h3>Alex</h3>

                    <p>
                        Привет! 👋
                    </p>

                </div>

            </div>


            <div class="chat"
                 onclick="openChat('Max')">

                <div class="avatar">
                    M
                </div>

                <div class="chat-info">

                    <h3>Max</h3>

                    <p>
                        Как дела?
                    </p>

                </div>

            </div>


            <div class="chat"
                 onclick="openChat('IT Group')">

                <div class="avatar">
                    💻
                </div>

                <div class="chat-info">

                    <h3>IT Group</h3>

                    <p>
                        Новый проект 🚀
                    </p>

                </div>

            </div>

        </div>

        <div class="bottom">

            <button
                class="active"
                onclick="showHome()">

                💬 Чаты

            </button>

            <button
                onclick="showProfile()">

                👤 Профиль

            </button>

        </div>

    </div>


    <!-- CHAT -->

    <div
        id="chatScreen"
        class="chat-screen">

        <div class="chat-header">

            <span
                class="back"
                onclick="closeChat()">

                ←

            </span>

            <div
                class="avatar"
                id="chatAvatar">

                A

            </div>

            <div>

                <h3 id="chatName">
                    Alex
                </h3>

                <small>
                    в сети
                </small>

            </div>

        </div>


        <div
            class="messages"
            id="messages">

            <div class="message">
                Привет! 👋
            </div>

            <div class="message me">
                Привет! Как дела?
            </div>

        </div>


        <div class="input-area">

            <input
                id="messageInput"
                type="text"
                placeholder="Сообщение..."
                onkeydown="enterMessage(event)"
            >

            <button
                onclick="sendMessage()">

                ➤

            </button>

        </div>

    </div>


    <!-- PROFILE -->

    <div
        id="profile"
        class="profile">

        <div
            class="profile-avatar"
            id="profileAvatar">

            👤

        </div>

        <h2 id="profileName">
            Telegram User
        </h2>

        <div
            class="username"
            id="profileUsername">

            @username

        </div>


        <div class="balance">

            <div class="balance-title">
                💰 Баланс
            </div>

            <div class="balance-value">
                10 000
            </div>

        </div>


        <div
            class="user-id"
            id="profileId">

            Telegram ID: —

        </div>


        <button
            class="close-button"
            onclick="closeWebApp()">

            Закрыть приложение

        </button>

    </div>

</div>


<script>

    /*
       TELEGRAM WEB APP
    */

    const tg = window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    /*
       Получаем пользователя Telegram
    */

    const user = tg.initDataUnsafe?.user;


    if (user) {

        const name =
            user.first_name ||
            "Telegram User";

        const username =
            user.username
                ? "@" + user.username
                : "username не указан";


        document.getElementById(
            "profileName"
        ).innerText = name;


        document.getElementById(
            "profileUsername"
        ).innerText = username;


        document.getElementById(
            "profileId"
        ).innerText =
            "Telegram ID: " + user.id;


        /*
           Первая буква имени
        */

        document.getElementById(
            "profileAvatar"
        ).innerText =
            name.charAt(0).toUpperCase();

    }


    /*
       ОТКРЫТЬ ЧАТ
    */

    function openChat(name) {

        document.getElementById(
            "home"
        ).style.display = "none";


        document.getElementById(
            "profile"
        ).style.display = "none";


        document.getElementById(
            "chatScreen"
        ).style.display = "flex";


        document.getElementById(
            "chatName"
        ).innerText = name;


        document.getElementById(
            "chatAvatar"
        ).innerText =
            name === "IT Group"
                ? "💻"
                : name.charAt(0);


        document.getElementById(
            "messages"
        ).innerHTML = `

            <div class="message">
                Привет! Это чат с ${name} 👋
            </div>

        `;

    }


    /*
       ЗАКРЫТЬ ЧАТ
    */

    function closeChat() {

        document.getElementById(
            "chatScreen"
        ).style.display = "none";


        document.getElementById(
            "home"
        ).style.display = "block";

    }


    /*
       ОТПРАВИТЬ СООБЩЕНИЕ
    */

    function sendMessage() {

        const input =
            document.getElementById(
                "messageInput"
            );


        const text =
            input.value.trim();


        if (!text) return;


        const message =
            document.createElement(
                "div"
            );


        message.className =
            "message me";


        message.innerText =
            text;


        document.getElementById(
            "messages"
        ).appendChild(message);


        input.value = "";


        const messages =
            document.getElementById(
                "messages"
            );


        messages.scrollTop =
            messages.scrollHeight;

    }


    /*
       ENTER
    */

    function enterMessage(event) {

        if (event.key === "Enter") {

            sendMessage();

        }

    }


    /*
       ПРОФИЛЬ
    */

    function showProfile() {

        document.getElementById(
            "home"
        ).style.display = "none";


        document.getElementById(
            "chatScreen"
        ).style.display = "none";


        document.getElementById(
            "profile"
        ).style.display = "block";

    }


    /*
       ЧАТЫ
    */

    function showHome() {

        document.getElementById(
            "profile"
        ).style.display = "none";


        document.getElementById(
            "chatScreen"
        ).style.display = "none";


        document.getElementById(
            "home"
        ).style.display = "block";

    }


    /*
       ПОИСК
    */

    function searchChats() {

        const query =
            document.getElementById(
                "search"
            ).value.toLowerCase();


        const chats =
            document.querySelectorAll(
                ".chat"
            );


        chats.forEach(chat => {

            const name =
                chat.querySelector(
                    "h3"
                ).innerText.toLowerCase();


            chat.style.display =
                name.includes(query)
                    ? "flex"
                    : "none";

        });

    }


    /*
       ЗАКРЫТЬ WEB APP
    */

    function closeWebApp() {

        tg.close();

    }

</script>

</body>
</html>
