<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление хостингом</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #161b22;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #30363d;
        }
        h1, h2, h3 {
            color: #f0f6fc;
            margin-bottom: 16px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
            margin-bottom: 24px;
        }
        .header h1 {
            margin: 0;
            font-size: 24px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .user-info span {
            color: #8b949e;
        }
        .btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-block;
            text-decoration: none;
            font-weight: 500;
        }
        .btn:hover {
            background: #30363d;
        }
        .btn-danger {
            background: #da3633;
            border-color: #f85149;
            color: white;
        }
        .btn-danger:hover {
            background: #f85149;
        }
        .btn-success {
            background: #238636;
            border-color: #2ea043;
            color: white;
        }
        .btn-success:hover {
            background: #2ea043;
        }
        .btn-primary {
            background: #1f6feb;
            border-color: #58a6ff;
            color: white;
        }
        .btn-primary:hover {
            background: #58a6ff;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .login-form {
            max-width: 360px;
            margin: 0 auto;
            padding: 20px 0;
        }
        .login-form label {
            display: block;
            margin-top: 12px;
            font-weight: 500;
            color: #8b949e;
        }
        .login-form input {
            width: 100%;
            padding: 10px 12px;
            margin-top: 4px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 16px;
        }
        .login-form input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .login-form .error {
            color: #f85149;
            margin-top: 8px;
            font-size: 14px;
        }
        .login-form .btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            font-size: 16px;
        }
        .server-card {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .server-card h3 {
            margin-top: 0;
            font-size: 20px;
        }
        .server-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px 20px;
            margin: 12px 0;
        }
        .server-info .label {
            color: #8b949e;
            font-weight: 400;
        }
        .server-info .value {
            font-weight: 500;
        }
        .status-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: #21262d;
        }
        .status-running { color: #3fb950; }
        .status-offline { color: #f85149; }
        .status-starting { color: #d29922; }
        .status-stopping { color: #d29922; }
        .expired-badge {
            color: #f85149;
            font-weight: bold;
            margin-left: 8px;
        }
        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .actions .btn {
            flex: 1 0 auto;
            text-align: center;
        }
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }
        .admin-table th {
            text-align: left;
            padding: 10px 12px;
            background: #0d1117;
            border-bottom: 1px solid #30363d;
            color: #8b949e;
            font-weight: 500;
        }
        .admin-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #21262d;
            vertical-align: middle;
        }
        .admin-table tr:hover td {
            background: #161b22;
        }
        .admin-actions .btn {
            padding: 4px 10px;
            font-size: 12px;
            margin-right: 4px;
        }
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-20 { margin-top: 20px; }
        .mb-10 { margin-bottom: 10px; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        @media (max-width: 600px) {
            .container { padding: 16px; }
            .server-info { grid-template-columns: 1fr; }
            .header { flex-wrap: wrap; gap: 12px; }
            .admin-table { font-size: 13px; }
            .admin-actions .btn { font-size: 11px; padding: 3px 8px; }
        }
    </style>
</head>
<body>
<div class="container" id="app">

    <!-- Страница входа -->
    <div id="loginPage">
        <h1 class="text-center">🔐 Вход в систему</h1>
        <div class="login-form">
            <form id="loginForm" onsubmit="return login(event)">
                <label for="username">Логин</label>
                <input type="text" id="username" placeholder="Введите логин" required>
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль" required>
                <div id="loginError" class="error"></div>
                <button type="submit" class="btn btn-primary">Войти</button>
            </form>
        </div>
    </div>

    <!-- Основная панель (показывается после входа) -->
    <div id="dashboardPage" class="hidden">
        <div class="header">
            <h1>📦 Управление хостингом</h1>
            <div class="user-info">
                <span id="currentUser"></span>
                <button class="btn btn-danger" onclick="logout()">Выйти</button>
            </div>
        </div>

        <!-- Панель клиента -->
        <div id="clientPanel">
            <h2>🖥 Мои серверы</h2>
            <div id="clientServers"></div>
        </div>

        <!-- Панель администратора -->
        <div id="adminPanel" class="hidden">
            <h2>👑 Администрирование</h2>
            <p style="color:#8b949e;">Управление всеми серверами</p>
            <div id="adminServers"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
//  ДАННЫЕ (полностью в памяти браузера)
// ============================================================

// Пользователи
const USERS = {
    'ZZLOYPP': {
        password: 'PAANDAHOOST',
        role: 'owner'
    },
    'CLIENTTLIRA2026': {
        password: 'LIRAROMB20026',
        role: 'client'
    }
};

// Серверы (ключ - server_id)
let servers = {
    'srv1': {
        name: 'Проект Alpha',
        tariff: 'Базовый',
        expiry_date: '15.09.2026',
        expiry_time: '23:59',
        owner_tg: 123456789,   // условно
        status: 'running',
        cpu: 12.5,
        ram_mb: 512,
        disk_mb: 1024
    },
    'srv2': {
        name: 'Проект Beta',
        tariff: 'Премиум',
        expiry_date: '01.12.2026',
        expiry_time: '18:00',
        owner_tg: 123456789,
        status: 'offline',
        cpu: 0,
        ram_mb: 0,
        disk_mb: 2048
    }
};

// Какие серверы принадлежат клиенту
const CLIENT_SERVERS = {
    'CLIENTTLIRA2026': ['srv1', 'srv2']
};

// Текущий пользователь (устанавливается при входе)
let currentUser = null;
let currentRole = null;

// ============================================================
//  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
// ============================================================

function getStatusLabel(status) {
    const map = {
        'running': '🟢 Запущен',
        'starting': '🟡 Запускается',
        'stopping': '🟠 Останавливается',
        'offline': '🔴 Выключен'
    };
    return map[status] || status;
}

function isExpired(server) {
    try {
        const dt = new Date(server.expiry_date.split('.').reverse().join('-') + 'T' + server.expiry_time + ':00');
        return dt <= new Date();
    } catch(e) {
        return false;
    }
}

function formatDate(dateStr) {
    // просто возвращаем как есть
    return dateStr;
}

// ============================================================
//  РЕНДЕРИНГ
// ============================================================

function renderClientServers() {
    const container = document.getElementById('clientServers');
    const serverIds = CLIENT_SERVERS[currentUser] || [];
    if (serverIds.length === 0) {
        container.innerHTML = '<p style="color:#8b949e;">У вас нет серверов.</p>';
        return;
    }
    let html = '';
    for (const sid of serverIds) {
        const s = servers[sid];
        if (!s) continue;
        const expired = isExpired(s);
        const statusClass = 'status-' + s.status;
        html += `
            <div class="server-card" id="server-${sid}">
                <h3>🖥 ${s.name}</h3>
                <div class="server-info">
                    <div><span class="label">Тариф:</span> <span class="value">${s.tariff}</span></div>
                    <div><span class="label">Доступен до:</span> <span class="value">${s.expiry_date} (${s.expiry_time} МСК) ${expired ? '<span class="expired-badge">⚠️ Истёк</span>' : ''}</span></div>
                    <div><span class="label">Статус:</span> <span class="value"><span class="status-badge ${statusClass}">${getStatusLabel(s.status)}</span></span></div>
                    <div><span class="label">CPU:</span> <span class="value" id="cpu-${sid}">${s.cpu}</span>%</div>
                    <div><span class="label">RAM:</span> <span class="value" id="ram-${sid}">${s.ram_mb}</span> МБ</div>
                    <div><span class="label">Диск:</span> <span class="value">${s.disk_mb} МБ</span></div>
                </div>
                <div class="actions">
                    <button class="btn btn-success" onclick="powerAction('${sid}','start')" ${expired ? 'disabled' : ''}>▶️ Запустить</button>
                    <button class="btn btn-danger" onclick="powerAction('${sid}','stop')" ${expired ? 'disabled' : ''}>⏹ Остановить</button>
                </div>
                ${expired ? '<p style="color:#f85149;margin-top:8px;">⛔ Управление заблокировано – срок истёк</p>' : ''}
            </div>
        `;
    }
    container.innerHTML = html;
}

function renderAdminServers() {
    const container = document.getElementById('adminServers');
    const sids = Object.keys(servers);
    if (sids.length === 0) {
        container.innerHTML = '<p style="color:#8b949e;">Нет серверов.</p>';
        return;
    }
    let html = `<table class="admin-table">
        <thead><tr>
            <th>Название</th>
            <th>Владелец (tg)</th>
            <th>Тариф</th>
            <th>Доступен до</th>
            <th>Статус</th>
            <th>Действия</th>
        </tr></thead><tbody>`;
    for (const sid of sids) {
        const s = servers[sid];
        const expired = isExpired(s);
        html += `<tr>
            <td><strong>${s.name}</strong></td>
            <td>${s.owner_tg}</td>
            <td>${s.tariff}</td>
            <td>${s.expiry_date} ${s.expiry_time} МСК ${expired ? '<span class="expired-badge">Истёк</span>' : ''}</td>
            <td><span class="status-badge status-${s.status}">${getStatusLabel(s.status)}</span></td>
            <td class="admin-actions">
                <button class="btn btn-success" onclick="extendServer('${sid}',7)">+7д</button>
                <button class="btn btn-success" onclick="extendServer('${sid}',30)">+30д</button>
                <button class="btn btn-danger" onclick="if(confirm('Удалить сервер ${s.name}?')) deleteServer('${sid}')">Удалить</button>
            </td>
        </tr>`;
    }
    html += '</tbody></table>';
    container.innerHTML = html;
}

function renderAll() {
    if (!currentUser) return;
    document.getElementById('currentUser').textContent = currentUser + (currentRole === 'owner' ? ' (админ)' : '');
    if (currentRole === 'client') {
        document.getElementById('clientPanel').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        renderClientServers();
    } else if (currentRole === 'owner') {
        document.getElementById('clientPanel').classList.add('hidden');
        document.getElementById('adminPanel').classList.remove('hidden');
        renderAdminServers();
    }
}

// ============================================================
//  ДЕЙСТВИЯ
// ============================================================

function login(e) {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const errorEl = document.getElementById('loginError');
    const user = USERS[username];
    if (!user || user.password !== password) {
        errorEl.textContent = '❌ Неверный логин или пароль';
        return false;
    }
    currentUser = username;
    currentRole = user.role;
    document.getElementById('loginPage').classList.add('hidden');
    document.getElementById('dashboardPage').classList.remove('hidden');
    renderAll();
    errorEl.textContent = '';
    return false;
}

function logout() {
    currentUser = null;
    currentRole = null;
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('dashboardPage').classList.add('hidden');
}

function powerAction(serverId, action) {
    const s = servers[serverId];
    if (!s) return;
    if (isExpired(s)) {
        alert('Срок аренды истёк! Управление заблокировано.');
        return;
    }
    // Имитация отправки команды
    const btn = document.querySelector(`#server-${serverId} .btn-${action === 'start' ? 'success' : 'danger'}`);
    if (btn) { btn.disabled = true; btn.textContent = '⏳ ...'; }

    // Эмуляция задержки
    setTimeout(() => {
        if (action === 'start') {
            if (s.status === 'running') {
                alert('Сервер уже запущен');
            } else {
                s.status = 'running';
                s.cpu = 15 + Math.random() * 20;
                s.ram_mb = 400 + Math.random() * 200;
            }
        } else if (action === 'stop') {
            if (s.status === 'offline') {
                alert('Сервер уже остановлен');
            } else {
                s.status = 'offline';
                s.cpu = 0;
                s.ram_mb = 0;
            }
        }
        renderAll(); // перерисовать
        if (btn) { btn.disabled = false; btn.textContent = action === 'start' ? '▶️ Запустить' : '⏹ Остановить'; }
    }, 1500);
}

// Админские функции
function extendServer(serverId, days) {
    const s = servers[serverId];
    if (!s) return;
    try {
        let parts = s.expiry_date.split('.');
        let dateObj = new Date(parts[2], parts[1]-1, parts[0], ...s.expiry_time.split(':'));
        dateObj.setDate(dateObj.getDate() + days);
        s.expiry_date = String(dateObj.getDate()).padStart(2,'0') + '.' + String(dateObj.getMonth()+1).padStart(2,'0') + '.' + dateObj.getFullYear();
        s.expiry_time = String(dateObj.getHours()).padStart(2,'0') + ':' + String(dateObj.getMinutes()).padStart(2,'0');
        renderAll();
        alert(`✅ Срок продлён на ${days} дней`);
    } catch(e) {
        alert('Ошибка при продлении');
    }
}

function deleteServer(serverId) {
    if (!servers[serverId]) return;
    delete servers[serverId];
    // Удалить из привязок клиентов
    for (let client in CLIENT_SERVERS) {
        const idx = CLIENT_SERVERS[client].indexOf(serverId);
        if (idx !== -1) CLIENT_SERVERS[client].splice(idx, 1);
    }
    renderAll();
    alert('✅ Сервер удалён');
}

// ============================================================
//  ИНИЦИАЛИЗАЦИЯ
// ============================================================

// При загрузке показываем страницу входа
document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('loginPage').classList.remove('hidden');
    document.getElementById('dashboardPage').classList.add('hidden');
});
</script>
</body>
</html>

    </script>
