<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Краш | Lira</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: #12131C; color: #FFF; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1E202D; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .balance-box { font-size: 18px; color: #8E92A8; margin-bottom: 15px; }
        .balance-box span { color: #4EAC6D; font-weight: bold; }
        .crash-display { height: 150px; background: #171822; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 48px; font-weight: bold; color: #5865F2; margin-bottom: 20px; border: 1px solid #2E3245; }
        .crash-display.crashed { color: #FF4D4D; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; font-size: 12px; color: #8E92A8; margin-bottom: 5px; }
        .input-group input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #2E3245; background: #171822; color: #FFF; font-size: 16px; outline: none; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-start { background: #5865F2; color: white; }
        .btn-take { background: #4EAC6D; color: white; display: none; }
        .btn:disabled { background: #3A3D4D; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <h2>🚀 Игра «Краш»</h2>
    <div class="balance-box">Баланс: <span id="balance">0</span> LIRA</div>

    <div class="input-group" id="idInputGroup" style="display: none;">
        <label>Ваш Telegram ID:</label>
        <input type="number" id="manualUserId" placeholder="Введите ID">
    </div>

    <div class="crash-display" id="multiplier">1.00x</div>

    <div class="input-group">
        <label>Ставка:</label>
        <input type="number" id="betAmount" value="100" min="1">
    </div>

    <button id="btnStart" class="btn btn-start" onclick="startGame()">Сделать ставку</button>
    <button id="btnTake" class="btn btn-take" onclick="takeMoney()">Забрать</button>
</div>

<script>
    const SERVER_URL = "https://your-domain.com"; // ЗАМЕНИТЕ НА URL ВАШЕГО СЕРВЕРА
    let tg = window.Telegram.WebApp;
    let userId = null;
    let currentMultiplier = 1.00;
    let crashMultiplier = 1.00;
    let gameInterval = null;
    let isPlaying = false;

    // Определение ID пользователя
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        userId = tg.initDataUnsafe.user.id;
    } else {
        document.getElementById('idInputGroup').style.display = 'block';
    }

    async function loadBalance() {
        let activeId = userId || document.getElementById('manualUserId').value;
        if (!activeId) return;
        
        try {
            let res = await fetch(`${SERVER_URL}/get_balance?user_id=${activeId}`);
            let data = await res.json();
            if (data.status === 'ok') {
                document.getElementById('balance').textContent = data.balance;
            }
        } catch (e) {
            console.error("Ошибка загрузки баланса", e);
        }
    }

    async function startGame() {
        let activeId = userId || document.getElementById('manualUserId').value;
        let bet = parseFloat(document.getElementById('betAmount').value);

        if (!activeId) return alert("Введите Ваш Telegram ID!");
        if (!bet || bet <= 0) return alert("Введите корректную ставку!");

        // Списание ставки на сервере
        let res = await fetch(`${SERVER_URL}/start_crash`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: activeId, bet: bet })
        });
        let data = await res.json();

        if (data.status !== 'ok') {
            return alert(data.message || "Недостаточно средств!");
        }

        document.getElementById('balance').textContent = data.new_balance;
        crashMultiplier = data.crash_point;
        currentMultiplier = 1.00;
        isPlaying = true;

        // Переключение кнопок
        document.getElementById('btnStart').style.display = 'none';
        document.getElementById('btnTake').style.display = 'block';
        document.getElementById('multiplier').classList.remove('crashed');

        // Запуск роста коэффициента
        gameInterval = setInterval(() => {
            currentMultiplier += 0.01 + (currentMultiplier * 0.005);
            if (currentMultiplier >= crashMultiplier) {
                endGame(false);
            } else {
                document.getElementById('multiplier').textContent = currentMultiplier.toFixed(2) + 'x';
            }
        }, 100);
    }

    async function takeMoney() {
        if (!isPlaying) return;
        clearInterval(gameInterval);
        isPlaying = false;

        let activeId = userId || document.getElementById('manualUserId').value;
        let bet = parseFloat(document.getElementById('betAmount').value);
        let winAmount = bet * currentMultiplier;

        let res = await fetch(`${SERVER_URL}/win_crash`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user_id: activeId, win_amount: winAmount, coef: currentMultiplier.toFixed(2) })
        });
        let data = await res.json();

        document.getElementById('balance').textContent = data.new_balance;
        alert(`Вы выиграли ${winAmount.toFixed(0)} LIRA! (x${currentMultiplier.toFixed(2)})`);
        resetUI();
    }

    function endGame(isWin) {
        clearInterval(gameInterval);
        isPlaying = false;
        document.getElementById('multiplier').textContent = crashMultiplier.toFixed(2) + 'x CRASH!';
        document.getElementById('multiplier').classList.add('crashed');
        resetUI();
    }

    function resetUI() {
        document.getElementById('btnStart').style.display = 'block';
        document.getElementById('btnTake').style.display = 'none';
    }

    setInterval(loadBalance, 3000); // Автообновление баланса каждые 3 сек
</script>
</body>
</html>
